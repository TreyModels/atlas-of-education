name: "Propose a version of a model"
description: "Share your modified version of an Atlas model for review"
title: "Version: "
labels: ["proposed-version"]
body:
  - type: markdown
    attributes:
      value: |
        Proposals are reviewed by Dr Trey Menefee before anything is listed on the site.
        Read [CONTRIBUTING.md](../../CONTRIBUTING.md) first. Credit the original model
        and its authors as required by the repository [LICENSE](../../LICENSE).
  - type: input
    id: model
    attributes:
      label: Model
      description: The Atlas model this version modifies, as a path.
      placeholder: "angkor/petri"
    validations:
      required: true
  - type: input
    id: fork_url
    attributes:
      label: Fork or repository URL
      description: Link to your fork or repository containing the modified version.
      placeholder: "https://github.com/your-name/atlas-of-education/tree/your-branch"
    validations:
      required: true
  - type: input
    id: base_commit
    attributes:
      label: Base commit
      description: The atlas-of-education commit you started from.
      placeholder: "e.g. 4f2a91c"
    validations:
      required: true
  - type: textarea
    id: what_changed
    attributes:
      label: What changed
      description: Which rule, parameter or data changed, and why.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Exact commands to reproduce your results.
      render: shell
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Sources and results. State what they show and what they do not show.
    validations:
      required: true
  - type: dropdown
    id: purpose
    attributes:
      label: Purpose
      description: What is this version for? Optional.
      options:
        - Theoretical exploration
        - Teaching
        - Description and accounting
        - Prediction
        - Policy scenario
