<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../icons/icon-192.png">
<title>The Atlas of Education</title>
<meta name="description" content="The Atlas of Education 0.9: planning worlds, a six-district city and China's graduate labour market with Tilly's categorical core, all running in the browser.">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Rubik:wght@300;400;500;600&display=swap');

:root {
  --bg: #f5f9fb;
  --panel: #fbfcfc;
  --panel-2: #eef3f3;
  --ink: #363e40;
  --ink-strong: #202b2d;
  --muted: #607889;
  --line: #d6dfe1;
  --grid: #e5ebec;
  --accent: #ffca34;
  --accent-green: #527b68;
  --accent-soft: #dce8df;
  --rust: #a84f38;
  --land: #e7eee4;
  --water: #b6cfda;
  --road: #d8d5c9;
  --shadow: 0 14px 50px rgb(32 43 45 / .10);
  --sans: 'Rubik', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
  --mono: 'DM Mono', ui-monospace, monospace;
  color-scheme: light;
}
:root[data-theme='dark'] {
  --bg: #161b1d;
  --panel: #1d2426;
  --panel-2: #252e30;
  --ink: #d9e1df;
  --ink-strong: #f0f3ee;
  --muted: #9babb2;
  --line: #354245;
  --grid: #2b3639;
  --accent: #ffca34;
  --accent-green: #8eb59d;
  --accent-soft: #2b3c33;
  --rust: #e18469;
  --land: #26372d;
  --water: #315362;
  --road: #444a43;
  --shadow: 0 14px 50px rgb(0 0 0 / .30);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; }
button { color: inherit; cursor: pointer; }
button, a, input { -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible, [role='button']:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
button:disabled { opacity: .45; cursor: not-allowed; }
a { color: inherit; }
::selection { background: var(--accent); color: #202b2d; }
.app-shell { min-height: 100dvh; }
.brand-button { border: 0; background: transparent; padding: 0; text-align: left; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand svg { width: 39px; height: 39px; fill: none; stroke: var(--accent-green); stroke-width: 1.5; }
.brand strong { display: block; font-family: var(--serif); font-size: 23px; line-height: 1.1; font-weight: 500; color: var(--ink-strong); }
.brand span { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
.brand.compact strong { font-size: 20px; }
.brand.compact svg { width: 30px; height: 30px; }
.icon-button { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid var(--line); border-radius: 50%; transition: background .18s, transform .18s; }
.icon-button:hover { background: var(--panel-2); }
.icon-button:active { transform: scale(.95); }
.text-button { min-height: 44px; display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; color: var(--accent-green); padding: 0; font-weight: 500; }
.text-button:hover { text-decoration: underline; text-underline-offset: 4px; }
.overline { margin: 0 0 14px; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--muted); font-weight: 500; }

/* Library */
.site-header { min-height: 88px; padding: 16px clamp(18px, 4vw, 64px); display: flex; align-items: center; justify-content: space-between; gap: 24px; border-bottom: 1px solid var(--line); background: var(--panel); }
.site-header nav { display: flex; align-items: center; gap: 32px; }
.site-header nav button { position: relative; min-height: 44px; border: 0; background: transparent; padding: 0; font-size: 14px; }
.site-header nav button:hover { color: var(--ink-strong); }
.site-header nav .nav-active::after { content: ''; position: absolute; height: 3px; background: var(--accent); left: 0; right: 0; bottom: 1px; }
.header-actions { display: flex; align-items: center; gap: 20px; }
.browser-badge { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.browser-badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-green); }
.library-main { max-width: 1440px; margin: 0 auto; padding: 0 clamp(18px, 4vw, 64px); }
.library-intro { padding: clamp(48px, 8vw, 108px) 0 clamp(44px, 6vw, 78px); display: grid; grid-template-columns: 1.3fr .8fr; gap: 9vw; align-items: end; }
.library-intro h1 { font-family: var(--serif); font-size: clamp(52px, 6.3vw, 91px); line-height: .99; font-weight: 400; letter-spacing: -.045em; margin: 0; color: var(--ink-strong); }
.library-intro h1 em { font-weight: 400; color: var(--accent-green); }
.intro-copy { padding-bottom: 8px; }
.intro-copy p { margin: 0 0 25px; max-width: 53ch; font-size: 17px; line-height: 1.7; }
.intro-copy span { font-family: var(--mono); font-size: 11px; line-height: 1.6; color: var(--muted); }
.catalog-tools { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 14px 0; display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px; }
.filter-row { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.filter-row > svg { margin-right: 8px; }
.filter-row button { min-height: 44px; border: 0; background: transparent; padding: 8px 14px; border-radius: 3px; font-size: 13px; color: var(--muted); }
.filter-row button.active { background: var(--panel-2); color: var(--ink-strong); font-weight: 500; }
.search-box { display: flex; align-items: center; gap: 8px; min-width: 210px; color: var(--muted); }
.search-box input { min-height: 44px; width: 100%; border: 0; background: transparent; color: var(--ink); outline: none; }
.search-box:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.search-box button { border: 0; background: transparent; width: 44px; height: 44px; display: grid; place-items: center; }
.scenario-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
.scenario-card { min-width: 0; display: flex; flex-direction: column; padding: 0; text-align: left; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); overflow: hidden; transition: transform .22s ease-out, border-color .22s, box-shadow .22s; }
.scenario-card:hover { transform: translateY(-4px); border-color: var(--accent-green); box-shadow: var(--shadow); }
.scenario-card:active { transform: translateY(-1px); }
.scenario-card.featured { grid-column: span 2; }
.scenario-top { display: flex; justify-content: space-between; gap: 12px; padding: 14px 18px; font-family: var(--mono); font-size: 9px; letter-spacing: .08em; color: var(--muted); border-bottom: 1px solid var(--grid); }
.scenario-visual { position: relative; height: 174px; background: var(--land); overflow: hidden; }
.featured .scenario-visual { height: 225px; }
.scenario-visual svg { width: 100%; height: 100%; display: block; }
.direction-label { position: absolute; left: 16px; bottom: 12px; background: var(--panel); padding: 3px 8px; font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.mini-river { fill: none; stroke: var(--water); stroke-width: 12; }
.mini-land { fill: var(--land); stroke: var(--line); }
.mini-district { fill: #b8cbaa; stroke: var(--panel); stroke-width: 5; }
.mini-district.d1, .mini-district.d4 { fill: #d9d7ab; }
.mini-district.d3 { fill: #d9a43a; }
.mini-school { fill: var(--accent-green); }
.mini-school.hot { fill: var(--rust); }
.scenario-body { padding: 22px 20px 20px; flex: 1; }
.scenario-body h2 { font-family: var(--serif); font-weight: 400; font-size: 30px; letter-spacing: -.025em; line-height: 1.1; color: var(--ink-strong); margin: 0 0 10px; }
.featured .scenario-body h2 { font-size: 38px; }
.scenario-body p { margin: 0; color: var(--muted); font-size: 14px; max-width: 55ch; }
.scenario-foot { min-height: 55px; border-top: 1px solid var(--grid); padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 10px; color: var(--muted); }
.enter-world { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-strong); font-size: 12px; font-weight: 500; white-space: nowrap; }
.scenario-card:hover .enter-world svg { transform: translateX(3px); }
.enter-world svg { transition: transform .18s; }
.empty-state { padding: 70px 20px; border: 1px dashed var(--line); text-align: center; }
.empty-state svg { color: var(--muted); }
.empty-state h2 { font-family: var(--serif); font-size: 28px; font-weight: 400; margin: 15px 0 5px; }
.empty-state p { color: var(--muted); }
.library-note { margin: 58px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 30px 0; display: grid; grid-template-columns: auto 1fr auto; gap: 22px; align-items: center; }
.library-note > svg { color: var(--accent-green); }
.library-note h2 { margin: 0 0 5px; font-family: var(--serif); font-size: 24px; font-weight: 400; }
.library-note p { margin: 0; font-size: 13px; color: var(--muted); max-width: 75ch; }
.site-footer { padding: 26px clamp(18px, 4vw, 64px) max(26px, env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 28px; border-top: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 11px; }
.site-footer > span { margin-left: auto; }
.site-footer > button { min-height: 44px; border: 0; background: transparent; color: var(--muted); font-size: 11px; text-decoration: underline; text-underline-offset: 3px; }

/* Workspace */
.workspace-header { min-height: 66px; padding: 8px 20px; display: flex; align-items: center; gap: 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30; }
.back-button { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; border: 0; background: transparent; padding: 0 8px 0 0; font-size: 13px; }
.back-button:hover { color: var(--accent-green); }
.workspace-header .brand { padding-left: 20px; border-left: 1px solid var(--line); }
.workspace-world-title { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; line-height: 1.3; }
.workspace-world-title span { font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.workspace-world-title strong { font-size: 13px; font-weight: 500; }
.workspace-actions { display: flex; gap: 8px; align-items: center; }
.workspace-actions > button:first-child { min-height: 44px; display: inline-flex; align-items: center; gap: 7px; background: transparent; border: 0; padding: 0 10px; font-size: 12px; }
.workspace { max-width: 1800px; margin: 0 auto; }
.world-sign { position: relative; padding: 20px 24px 15px; display: flex; gap: 28px; align-items: center; border-bottom: 1px solid var(--line); }
.world-sign-copy { flex: 1; min-width: 0; }
.world-sign-copy .overline { margin-bottom: 5px; }
.world-sign h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(24px, 2.3vw, 36px); line-height: 1.12; color: var(--ink-strong); letter-spacing: -.025em; }
.year-transport { display: flex; align-items: center; gap: 7px; }
.year-transport > button:not(.icon-button) { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); padding: 0 13px; font-size: 12px; }
.year-transport > button:hover { border-color: var(--accent-green); }
.year-transport > button.play-button { background: var(--ink-strong); color: var(--panel); border-color: var(--ink-strong); }
.year-transport output { min-width: 108px; text-align: right; font-family: var(--mono); font-size: 36px; line-height: 1; color: var(--accent-green); font-weight: 500; }
.timeline { position: absolute; left: 0; right: 0; bottom: -2px; height: 4px; display: block; }
.timeline input { position: absolute; z-index: 2; inset: -12px 0; width: 100%; height: 28px; opacity: 0; cursor: ew-resize; margin: 0; }
.timeline > span { display: block; height: 3px; background: var(--accent); pointer-events: none; transition: width .15s; }
.timeline:focus-within { outline: 2px solid var(--accent); outline-offset: 4px; }
.metrics-strip { display: grid; grid-template-columns: repeat(4,1fr); border-bottom: 1px solid var(--line); background: var(--panel); }
.metrics-strip > div { padding: 14px 24px; border-right: 1px solid var(--line); }
.metrics-strip > div:last-child { border: 0; }
.metrics-strip span { display: block; font-size: 11px; color: var(--muted); }
.metrics-strip strong { display: block; margin: 2px 0 1px; font-family: var(--mono); font-weight: 400; font-size: 25px; color: var(--ink-strong); }
.metrics-strip strong i { font-style: normal; font-size: 12px; color: var(--muted); margin-left: 3px; }
.metrics-strip small { display: block; font-size: 10px; color: var(--muted); }
.negative { color: var(--rust) !important; }
.workspace-grid { display: grid; grid-template-columns: minmax(240px, 280px) minmax(440px, 1fr) minmax(280px, 340px); grid-template-areas: 'decide center brief' 'decide numbers brief'; align-items: start; }
.workspace-panel { background: var(--panel); min-width: 0; }
.decision-panel { grid-area: decide; border-right: 1px solid var(--line); padding: 20px 18px 30px; }
.briefing-panel { grid-area: brief; border-left: 1px solid var(--line); padding: 20px 20px 30px; }
.center-stage { grid-area: center; min-width: 0; padding: 20px 22px 0; }
.numbers-panel { grid-area: numbers; min-width: 0; border-top: 1px solid var(--line); padding: 18px 22px 30px; }
.panel-heading { display: flex; gap: 10px; align-items: flex-start; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.panel-heading > svg { color: var(--accent-green); margin-top: 3px; }
.panel-heading h2 { font-size: 15px; margin: 0; font-weight: 500; color: var(--ink-strong); }
.panel-heading p { font-size: 11px; margin: 2px 0 0; color: var(--muted); }
.control-group { border-bottom: 1px solid var(--line); padding: 17px 0 8px; }
.control-group > h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 0 0 12px; color: var(--ink-strong); font-weight: 500; }
.control-group > p { font-size: 11px; line-height: 1.5; color: var(--muted); margin: -7px 0 12px; }
.control { display: block; margin-bottom: 16px; }
.control > label, .control > span, .slider-control > span { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; margin-bottom: 7px; }
.control output { font-family: var(--mono); color: var(--accent-green); font-size: 11px; }
.control small { display: block; color: var(--muted); font-size: 10px; line-height: 1.45; margin-top: 6px; }
.option-list { display: flex; flex-wrap: wrap; gap: 4px; }
.option-list button { min-height: 44px; padding: 7px 10px; border: 1px solid var(--line); background: transparent; border-radius: 3px; font-size: 10px; line-height: 1.25; }
.option-list button.active { background: var(--accent-soft); border-color: var(--accent-green); color: var(--ink-strong); font-weight: 500; }
.option-list button:hover { border-color: var(--accent-green); }
.slider-control input { width: 100%; height: 24px; margin: 0; accent-color: var(--accent-green); cursor: pointer; }
.assumptions-button { width: 100%; min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 12px 0 0; border: 0; background: transparent; color: var(--accent-green); font-size: 11px; text-align: left; }
.assumptions-button:hover { text-decoration: underline; }
.map-toolbar, .numbers-toolbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.map-toolbar .overline, .numbers-toolbar .overline { margin-bottom: 2px; }
.map-toolbar h2, .numbers-toolbar h2 { margin: 0; font-size: 16px; font-weight: 500; color: var(--ink-strong); }
.segmented { display: flex; align-items: center; border-bottom: 1px solid var(--line); }
.segmented button { min-height: 44px; padding: 0 10px; border: 0; border-bottom: 3px solid transparent; background: transparent; font-size: 10px; color: var(--muted); }
.segmented button.active { color: var(--ink-strong); border-bottom-color: var(--accent); }
.map-wrap { position: relative; border: 1px solid var(--line); background: var(--land); overflow: hidden; }
.world-map { display: block; width: 100%; height: clamp(310px, 39vh, 480px); }
.map-river { fill: none; stroke: var(--water); stroke-width: 35; opacity: .75; }
.map-road { fill: none; stroke: var(--road); stroke-width: 6; stroke-dasharray: 2 3; }
.district { cursor: pointer; }
.district > path:first-child { stroke: var(--panel); stroke-width: 4; transition: filter .2s, opacity .2s; }
.district:hover > path:first-child, .district.selected > path:first-child { filter: saturate(1.3); stroke: var(--ink-strong); stroke-width: 2; }
.district text { font-family: var(--sans); font-size: 14px; font-weight: 500; fill: #26352e; pointer-events: none; }
.district .district-value { font-family: var(--mono); font-size: 12px; }
.school-glyph { fill: var(--panel); stroke: #52675d; stroke-width: 1.4; pointer-events: none; }
.map-caption { display: flex; align-items: center; flex-wrap: wrap; gap: 7px 16px; padding: 9px 12px; background: var(--panel); border-top: 1px solid var(--line); font-size: 10px; color: var(--muted); }
.map-caption > span { display: inline-flex; align-items: center; gap: 5px; }
.key { display: inline-block; width: 10px; height: 10px; border-radius: 1px; }
.key.good { background: #b8cbaa; }
.key.pressure { background: #d9a43a; }
.key.acute { background: #b66a4d; }
.map-note { margin-left: auto; }
.land-outline { fill: var(--land); stroke: var(--line); }
.house-glyph { fill: none; stroke: var(--muted); opacity: .45; }
.school-marker { cursor: pointer; }
.school-marker path { stroke: var(--panel); stroke-width: 1; }
.school-marker:hover path, .school-marker.selected path { stroke: var(--ink-strong); stroke-width: 2.5; }
.touch-ring { fill: transparent; }
.college-glyph { fill: var(--accent); stroke: var(--ink); stroke-width: 1; }
.college-glyph text { fill: var(--muted); stroke: none; font-family: var(--sans); font-size: 10px; }
.map-inspector { display: flex; align-items: center; gap: 12px; min-height: 74px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.inspector-index { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.map-inspector > div { flex: 1; }
.map-inspector strong { font-size: 13px; font-weight: 500; color: var(--ink-strong); }
.map-inspector p { margin: 2px 0 0; font-size: 11px; color: var(--muted); }
.map-inspector > b { display: flex; flex-direction: column; align-items: flex-end; font-family: var(--mono); font-size: 21px; font-weight: 400; }
.map-inspector > b small { font-family: var(--sans); font-size: 9px; color: var(--muted); }
.year-brief { margin: 15px 0 20px; padding: 13px 15px; background: var(--panel-2); border-left: 2px solid var(--accent-green); }
.year-brief > span { font-family: var(--mono); font-size: 9px; letter-spacing: .08em; color: var(--muted); }
.year-brief p { margin: 5px 0 0; font-size: 12px; line-height: 1.6; }
.world-pitch { font-family: var(--serif); font-size: 19px; line-height: 1.45; color: var(--ink-strong); margin: 18px 0; }
.briefing-panel h3 { margin: 20px 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
.question-list { margin: 0; padding-left: 20px; font-size: 12px; }
.question-list li { margin-bottom: 8px; padding-left: 3px; }
.feed-heading { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); margin-top: 20px; }
.feed-heading span { font-family: var(--mono); font-size: 9px; color: var(--muted); }
.brief-feed article { padding-bottom: 10px; }
.brief-feed h4 { font-family: var(--mono); font-size: 13px; color: var(--accent-green); margin: 15px 0 5px; }
.brief-item { display: grid; grid-template-columns: 72px 1fr; gap: 7px; border-top: 1px solid var(--grid); padding: 7px 0; }
.brief-item > span { font-size: 9px; text-transform: capitalize; color: var(--muted); }
.brief-item p { margin: 0; font-size: 11px; line-height: 1.5; }
.brief-item p.history { color: var(--muted); }
.numbers-toolbar { align-items: center; }
.chart-frame { height: 230px; }
.chart-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 10px; color: var(--muted); }
.chart-foot button { min-height: 44px; display: inline-flex; align-items: center; gap: 5px; border: 0; background: transparent; color: var(--accent-green); font-size: 10px; }
.mobile-workspace-tabs { display: none; }

/* Dialogs */
.modal-backdrop { position: fixed; inset: 0; z-index: 80; padding: 20px; display: flex; align-items: center; justify-content: center; background: rgb(19 27 29 / .62); }
.model-modal { position: relative; width: min(800px, 100%); max-height: min(86dvh, 900px); overflow-y: auto; background: var(--panel); color: var(--ink); padding: clamp(24px, 5vw, 52px); border: 1px solid var(--line); box-shadow: var(--shadow); }
.modal-close { position: absolute; top: 12px; right: 12px; }
.model-modal > h2 { margin: 0; max-width: 15ch; font-family: var(--serif); font-size: clamp(32px, 5vw, 46px); font-weight: 400; line-height: 1.08; letter-spacing: -.03em; color: var(--ink-strong); }
.modal-lede { max-width: 68ch; color: var(--muted); font-size: 14px; margin: 18px 0 25px; }
.method-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 1px solid var(--line); }
.method-grid article { padding: 20px 20px 20px 0; border-bottom: 1px solid var(--line); }
.method-grid article:nth-child(odd) { border-right: 1px solid var(--line); }

<script>/* world.js */
/* Education Atlas — school-system world model (demography studio) v0.1
   A planning-layer world in the IIEP tradition (cohort flows, teachers, classrooms, money), with stocks, lags and a
   small number of declared behavioural struts (crowding -> dropout, pay -> attrition and tutoring, inputs -> quality).
   Pure functions, no dependencies. CommonJS in Node (tests), global AtlasWorld in a browser. */
(function (root) {
'use strict';

const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
const sum = a => a.reduce((s, x) => s + x, 0);

/* Linear interpolation over [[year, value], ...]; flat outside the range. */
function path(points, y) {
  if (typeof points === 'number') return points;
  if (!points || !points.length) return 0;
  if (y <= points[0][0]) return points[0][1];
  for (let i = 1; i < points.length; i++) {
    const [y1, v1] = points[i], [y0, v0] = points[i - 1];
    if (y <= y1) return v0 + (v1 - v0) * (y - y0) / (y1 - y0);
  }
  return points[points.length - 1][1];
}

/* Struts: the behavioural assumptions, in one place, each with a default, a plausible range and its evidence. */
const STRUTS = {
  crowd_dropout: {value: 0.10, lo: 0, hi: 0.3, unit: 'drop in promotion per 100% over the class-size norm',
    why: 'Crowding and double shifts lower attendance and persistence. Direction from Kenya FPE and Philippine reports; size assumed.'},
  shift_penalty: {value: 8, lo: 0, hi: 15, unit: 'quality points lost if every pupil is on a double shift',
    why: 'Double-shift schooling cuts contact hours (Bray 2008, IIEP Fundamentals of Educational Planning 90). Size assumed.'},
  ptr_effect: {value: 6, lo: 0, hi: 12, unit: 'quality points per halving of pupils per teacher',
    why: 'Class-size effects are positive but modest and contested (Krueger 1999 STAR; Hanushek 1999). Size assumed.'},
  untrained_penalty: {value: 6, lo: 0, hi: 15, unit: 'quality points if all teachers were contract/untrained',
    why: 'Contract teachers did as well in NGO-run trials (Duflo, Dupas & Kremer 2015) but not when government scaled them (Bold et al. 2018). Default is a middle view.'},
  inputs_effect: {value: 4, lo: 0, hi: 10, unit: 'quality points per doubling of non-salary spending per pupil',
    why: 'Textbooks and materials help mainly when matched to pupils’ level (Glewwe, Kremer & Moulin 2009). Size assumed.'},
  pay_attrition: {value: 0.06, lo: 0, hi: 0.15, unit: 'extra yearly attrition when pay is half the reference',
    why: 'Low relative pay raises exit and second jobs. Size assumed.'},
  pay_tutoring: {value: 0.5, lo: 0, hi: 1, unit: 'share of teachers selling tutoring to own pupils when pay is half the reference',
    why: 'Low teacher pay drives own-pupil tutoring and withheld classroom effort (Bray 1999, 2009; Jayachandran 2014).'},
  tutoring_penalty: {value: 6, lo: 0, hi: 15, unit: 'quality points lost for non-tutored pupils if all teachers tutor their own pupils',
    why: 'Teachers who sell tutoring may teach less in class (Jayachandran 2014). Size assumed.'},
  closure_dropout: {value: 0.04, lo: 0, hi: 0.1, unit: 'drop in primary promotion per 100% of rooms closed by consolidation',
    why: 'Longer travel after consolidation raises dropout, especially rural. Size assumed.'},
  union_layoff: {value: 40, lo: 0, hi: 80, unit: 'teacher-morale points lost per 10% of teachers laid off',
    why: 'Layoffs are politically costly; the meter is a game device, not an estimate.'},
};

/* Planner policy defaults: the levers. Everything a planner can decide. */
const POLICY = {
  ptr_target: [40, 35, 30],     // pupils per teacher, by level
  class_norm: 45,               // pupils per classroom per shift
  training: 'foresight',        // 'foresight' (plan from births already known) | 'reactive' (train for today's gap)
  train_capacity_growth: 0.15,  // max yearly change in teacher-college intake
  contract: false,              // hire contract teachers to fill gaps immediately
  contract_cap: 0.25,           // max contract share of required teachers
  surplus: 'attrition',         // 'keep' | 'attrition' (freeze hiring) | 'redeploy' (retrain to short levels) | 'layoff'
  freeze: false,                // hiring freeze: replace leavers only (Kenya 1998-)
  build: true,                  // build classrooms to the norm (2-year lag), within the capital budget
  capital_share: 0.08,          // max share of the budget for construction
  double_shift: true,           // allow two shifts when rooms are short
  consolidate: false,           // close rooms that stand empty
  pay: 1.0,                     // teacher pay relative to the reference (1 = adequate)
  edu_share: null,              // education spending, share of GDP (null = the world's own path)
};

function initWorld(W, policy) {
  const P = Object.assign({}, POLICY, W.policy || {}, policy || {});
  const struts = {};
  for (const k in STRUTS) struts[k] = (P.struts && P.struts[k] !== undefined) ? P.struts[k] : STRUTS[k].value;
  const L = W.levels.map(l => Object.assign({}, l));
  const G = sum(L.map(l => l.grades));
  const start = W.start, burn = W.burn || 25;
  const S = {W, P, struts, L, G, year: start - burn, rec: [], log: [],
    E: new Array(G).fill(0), lastCrowd: L.map(() => 1), closedShare: L.map(() => 0),
    T: L.map(() => 0), C: L.map(() => 0), R: L.map(() => 0), pipe: L.map(() => []), roomPipe: L.map(() => [0, 0]),
    trainIntake: L.map(() => 0), pool: L.map(() => 0), arrears: 0, catchupDone: false, layoffShare: 0,
    morale: {parents: 60, teachers: 60, treasury: 60}};
  S.gradeLevel = []; S.firstGrade = [];
  L.forEach((l, i) => { S.firstGrade.push(S.gradeLevel.length); for (let g = 0; g < l.grades; g++) S.gradeLevel.push(i); });
  // Burn-in: run the flows with resources that track need, so the first shown year starts from a consistent state.
  S.burning = true;
  while (S.year < start) stepWorld(S);
  S.burning = false; S.rec = []; S.log = [];
  const init = W.init || {};                       // the system's starting condition: e.g. a classroom backlog
  for (let i = 0; i < L.length; i++) {
    S.R[i] *= (init.rooms !== undefined ? init.rooms : 1);
    S.T[i] *= (init.teachers !== undefined ? init.teachers : 1);
  }
  return S;
}

function levelOpen(l, y) { return l.open === undefined || y >= l.open; }

function pop(S, age, y) {           // children of a given age in year y, from births and survival
  return path(S.W.births, y - age) * (S.W.survival_to_school || 0.95) * (S.W.cohort_factor || 1);
}

function ageGroup(S, i, y) {        // official-age population for level i
  const a0 = S.W.entry_age + sum(S.L.slice(0, i).map(l => l.grades));
  let n = 0;
  for (let a = a0; a < a0 + S.L[i].grades; a++) n += pop(S, a, y);
  return n;
}

function levelEnrol(S, E, i) {
  const f = S.firstGrade[i];
  return sum(E.slice(f, f + S.L[i].grades));
}

/* Projected enrolment of level i in year y+h, holding current rates: scale by the change in the official-age
   population (known from births for any h up to the entry age) and by the opening of new levels. */
function project(S, i, h) {
  const y = S.year, l = S.L[i];
  const now = levelEnrol(S, S.E, i);
  if (!levelOpen(l, y + h)) return 0;
  if (!levelOpen(l, y) || now === 0) {
    const prev = i > 0 ? levelEnrol(S, S.E, i - 1) / S.L[i - 1].grades : 0;
    return prev * l.grades * path(l.transition || 1, y + h) * (ageGroup(S, i, y + h) / Math.max(ageGroup(S, i, y), 1));
  }
  return now * ageGroup(S, i, y + h) / Math.max(ageGroup(S, i, y), 1);
}

function stepWorld(S) {
  const {W, P, L, struts: st} = S, y = S.year, nL = L.length;
  const gdp = path(W.gdp, y), gdppc = path(W.gdppc, y);
  const pay = path(P.pay, y);                                 // planner's pay lever (1 = the world's own pay path)
  const payRel = path(W.pay_rel || 1, y) * pay;               // pay relative to an adequate wage (1 = adequate)
  const salary = gdppc * path(W.salary_multiple, y) * pay;
  const budget = (P.edu_share !== null && !S.burning ? P.edu_share : path(W.edu_share, y)) * gdp;
  const notes = [];

  // ---- 1. pupils: intake, promotion (with crowding/closure feedback), repetition, transition, new levels
  const E0 = S.E.slice(), E1 = new Array(S.G).fill(0);
  const entrants = pop(S, W.entry_age, y) * path(W.intake, y);
  let catchup = 0;
  if (W.catchup && y === W.catchup.year && !S.catchupDone) {     // over-age children enrolling at once (fee abolition)
    let outOfSchool = 0;
    for (let a = W.entry_age + 1; a <= W.catchup.max_age; a++) outOfSchool += pop(S, a, y) * (1 - path(W.intake, y - 1));
    catchup = outOfSchool * W.catchup.share; S.catchupDone = true;
  }
  E1[0] += entrants + catchup;
  let dropouts = 0, completers = 0, graduates = new Array(nL).fill(0);
  for (let g = 0; g < S.G; g++) {
    const i = S.gradeLevel[g], l = L[i];
    if (!levelOpen(l, y - 1) && E0[g] === 0) continue;
    const crowd = Math.max(0, S.lastCrowd[i] - 1);
    let p = path(l.promotion, y) * (1 - st.crowd_dropout * crowd);
    if (i === 0) p *= (1 - st.closure_dropout * S.closedShare[0]);
    const r = path(l.repetition, y);
    p = clamp(p, 0, 1 - r);
    const rep = E0[g] * r, prom = E0[g] * p;
    dropouts += E0[g] - rep - prom;
    E1[g] += rep;
    const last = g === S.firstGrade[i] + l.grades - 1;
    if (!last) { E1[g + 1] += prom; continue; }
    graduates[i] += prom;
    if (i + 1 < nL && levelOpen(L[i + 1], y)) {
      const tr = path(L[i + 1].transition, y);
      E1[g + 1] += prom * tr; completers += prom * (1 - tr);
    } else completers += prom;
  }
  // conservation check: last year's pupils + entrants = this year's pupils + dropouts + leavers
  S.pupilResidual = sum(E0) + entrants + catchup - sum(E1) - dropouts - completers;
  S.E = E1;

  // ---- 2. teachers: attrition, pipeline arrivals, hiring, contract, surplus handling, training intake
  const enrol = L.map((_, i) => levelEnrol(S, S.E, i));
  const req = L.map((_, i) => enrol[i] / P.ptr_target[i]);
  const payGap = Math.max(0, 1 - payRel);                     // 0 when pay is adequate
  const attr = clamp(path(W.attrition, y) + st.pay_attrition * payGap * 2, 0, 0.5);
  let hires = 0, marketHires = 0, layoffs = 0, redeployed = 0, contractHires = 0, leavers = 0, trainCost = 0, retrainCost = 0;
  const shortage = L.map(() => 0), surplus = L.map(() => 0);
  for (let i = 0; i < nL; i++) {
    const out = S.T[i] * attr; leavers += out;
    S.T[i] -= out;
    const arrive = (S.pipe[i].length >= W.train_years) ? S.pipe[i].shift() : 0;
    S.pool[i] = S.pool[i] * 0.7 + arrive;                     // trained, not yet hired; 30% leave the pool each year
    let gap = req[i] - S.T[i];
    let h = 0;
    if (S.burning) { h = Math.max(0, gap); S.pool[i] = 0; }
    else if (gap > 0) {
      h = Math.min(gap, S.pool[i]);
      if (P.freeze) h = Math.min(h, out);
      S.pool[i] -= Math.min(S.pool[i], h);
    } else if (P.surplus === 'keep') {                         // keep the workforce: replace leavers even in surplus
      h = Math.min(out, S.pool[i]); S.pool[i] -= h;
    }
    if (!S.burning && req[i] - S.T[i] - h > 0 && !P.freeze) {   // qualified graduates hired from the open market
      const m = Math.min(req[i] - S.T[i] - h, (W.market_hire || 0.03) * req[i]);
      h += m; marketHires += m;
    }
    S.T[i] += h; hires += h;
    // contract teachers fill what remains, immediately (they leave when trained teachers arrive)
    const stillShort = Math.max(0, req[i] - S.T[i]);
    const wantC = (P.contract && !S.burning) ? Math.min(stillShort, P.contract_cap * req[i]) : 0;
    contractHires += Math.max(0, wantC - S.C[i]);
    S.C[i] = wantC;
    shortage[i] = Math.max(0, req[i] - S.T[i] - S.C[i]);
    surplus[i] = Math.max(0, S.T[i] - req[i] * 1.03);
  }
  if (!S.burning && sum(surplus) > 0) {
    if (P.surplus === 'layoff') {
      for (let i = 0; i < nL; i++) { layoffs += surplus[i]; S.T[i] -= surplus[i]; surplus[i] = 0; }
    } else if (P.surplus === 'redeploy') {
      for (let i = 0; i < nL; i++) for (let j = 0; j < nL; j++) {
        if (i === j || surplus[i] <= 0 || shortage[j] <= 0) continue;
        const m = Math.min(surplus[i], shortage[j], 0.1 * S.T[i]);   // retraining capacity: 10% of the stock per year
        S.T[i] -= m; S.T[j] += m; surplus[i] -= m; shortage[j] -= m; redeployed += m;
      }
      retrainCost = redeployed * salary * 0.5;
    }
    // 'keep' and 'attrition': the surplus stays on payroll; with 'attrition' nobody new is hired (handled above: gap<0)
  }
  const totalTeachers = sum(S.T) + sum(S.C);
  S.layoffShare = layoffs / Math.max(totalTeachers + layoffs, 1);
  // teacher-college intake (arrives after train_years)
  for (let i = 0; i < nL; i++) {
    let want;
    if (S.burning) want = req[i] * attr;
    else if (P.training === 'foresight') {
      const H = W.train_years, fut = project(S, i, H) / P.ptr_target[i];
      const survivors = S.T[i] * Math.pow(1 - attr, H) + sum(S.pipe[i]) + S.pool[i] * Math.pow(0.7, H);
      want = Math.max(0, fut - survivors);
    } else {
      want = Math.max(0, req[i] - S.T[i]) + req[i] * attr;     // react to today's gap and today's leavers
    }
    const prev = S.trainIntake[i] || want;
    const g = P.train_capacity_growth;
    const intake = S.burning ? want : clamp(want, prev * (1 - g), Math.max(prev * (1 + g), 50));
    S.trainIntake[i] = intake;
    S.pipe[i].push(intake);
    trainCost += intake * salary * 0.3;
  }

  // ---- 3. classrooms: construction pipeline (2-year lag), shifts, consolidation
  let roomsStarted = 0, roomsClosed = 0;
  const capBudget = P.capital_share * budget;
  const roomCost = gdppc * path(W.room_cost_multiple, y);
  for (let i = 0; i < nL; i++) {
    S.R[i] += S.roomPipe[i].shift() || 0;
    S.R[i] *= (1 - (W.room_decay || 0.01));
  }
  const needRooms = L.map((_, i) => enrol[i] / P.class_norm);
  let capLeft = S.burning ? Infinity : capBudget;
  // builders' capacity: new rooms a year cannot exceed a share of the existing stock (procurement, sites, contractors)
  let buildLeft = S.burning ? Infinity : (W.build_capacity || 0.06) * sum(S.R);
  for (let i = 0; i < nL; i++) {
    const coming = sum(S.roomPipe[i]);
    const futureNeed = S.burning ? needRooms[i] : project(S, i, 2) / P.class_norm;
    let start_ = (P.build || S.burning) ? Math.max(0, futureNeed - S.R[i] - coming) : 0;
    start_ = Math.min(start_, capLeft / roomCost, buildLeft);
    capLeft -= start_ * roomCost; buildLeft -= start_; roomsStarted += start_;
    S.roomPipe[i].push(start_);
    if (P.consolidate && !S.burning && S.R[i] > needRooms[i] * 1.15) {
      const c = (S.R[i] - needRooms[i] * 1.1) * 0.5;
      S.R[i] -= c; roomsClosed += c;
      S.closedShare[i] = clamp(S.closedShare[i] + c / Math.max(S.R[i], 1), 0, 1);
    } else S.closedShare[i] *= 0.9;
  }
  const shifts = [], classSize = [];
  for (let i = 0; i < nL; i++) {
    const perRoom = enrol[i] / Math.max(S.R[i], 1);
    const sh = P.double_shift ? clamp(perRoom / P.class_norm, 1, 2) : 1;
    shifts.push(sh); classSize.push(perRoom / sh);
    S.lastCrowd[i] = classSize[i] / P.class_norm;
  }

  // ---- 4. money: salaries first, then construction, then whatever is left for books and materials
  const salaryBill = sum(S.T) * salary + sum(S.C) * salary * (W.contract_pay || 0.5);
  const capital = roomsStarted * roomCost;
  const maint = sum(S.R) * roomCost * 0.02;
  const committed = salaryBill + capital + maint + trainCost + retrainCost;
  const nonsalary = Math.max(0, budget - committed);
  const pupils = sum(enrol);
  const nsPerPupil = nonsalary / Math.max(pupils, 1);
  const deficit = Math.max(0, committed - budget);
  if (!S.burning) S.arrears += deficit;

  // ---- 5. quality (a toy index, 0-100; 50 = the world's reference conditions) and tutoring
  const tutorShare = clamp(st.pay_tutoring * payGap * 2 + (W.tutoring_base || 0), 0, 1);
  const nsRef = gdppc * (W.ns_ref_multiple || 0.03);
  const Q = L.map((l, i) => {
    const ptrEff = enrol[i] / Math.max(S.T[i] + S.C[i], 1);
    const trained = S.T[i] / Math.max(S.T[i] + S.C[i], 1);
    let q = 50 + st.ptr_effect * Math.log2((l.ptr_ref || P.ptr_target[i]) / Math.max(ptrEff, 1))
      - st.shift_penalty * (shifts[i] - 1)
      - st.untrained_penalty * (1 - trained)
      + st.inputs_effect * Math.log2(Math.max(nsPerPupil, nsRef * 0.05) / nsRef)
      - st.tutoring_penalty * tutorShare;
    return clamp(q, 0, 100);
  });

  // ---- 6. meters and the record
  const totalPupils = pupils;
  const qAvg = totalPupils ? sum(Q.map((q, i) => q * enrol[i])) / totalPupils : 0;
  const crowdAvg = totalPupils ? sum(classSize.map((c, i) => c * enrol[i])) / totalPupils : 0;
  const m = S.morale;
  m.parents = clamp(m.parents * 0.7 + 0.3 * (qAvg + 10 - 50 * Math.max(0, crowdAvg / P.class_norm - 1)), 0, 100);
  m.teachers = clamp(m.teachers * 0.7 + 0.3 * (60 + 40 * (payRel - 1) - st.union_layoff * S.layoffShare * 10
    - 15 * Math.max(0, crowdAvg / P.class_norm - 1)), 0, 100);
  m.treasury = clamp(m.treasury * 0.7 + 0.3 * (70 - 100 * deficit / Math.max(budget, 1) - 5 * Math.log1p(S.arrears / Math.max(budget, 1))), 0, 100);
  const rec = {
    year: y, births: path(W.births, y), gdp, budget, salary, payRel,
    enrol, ageGroup: L.map((_, i) => ageGroup(S, i, y)), entrants: entrants + catchup, catchup,
    ger: L.map((_, i) => enrol[i] / Math.max(ageGroup(S, i, y), 1)),
    teachers: S.T.slice(), contract: S.C.slice(), required: req, shortage, surplus,
    trainIntake: S.trainIntake.slice(), pool: S.pool.slice(), hires, marketHires, leavers, layoffs, redeployed, contractHires,
    rooms: S.R.slice(), roomsStarted, roomsClosed, shifts, classSize,
    ptr: L.map((_, i) => enrol[i] / Math.max(S.T[i] + S.C[i], 1)),
    salaryBill, capital, committed, nonsalary, nsPerPupil, deficit, arrears: S.arrears,
    salaryShare: salaryBill / Math.max(budget, 1),
    quality: Q, qAvg, tutorShare, dropouts, completers, graduates,
    pupilResidual: S.pupilResidual, morale: Object.assign({}, m), open: L.map(l => levelOpen(l, y)),
  };
  if (!S.burning) { rec.brief = brief(S, rec); S.rec.push(rec); }
  S.year += 1;
  return rec;
}

/* ---- text output: deterministic yearly briefing from the state (no LLM needed) ---- */
const fmt = n => {
  const a = Math.abs(n);
  if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 1 : 2) + ' million';
  if (a >= 1e4) return Math.round(n / 1e3) + ',000';
  if (a >= 1e3) return (Math.round(n / 100) * 100).toLocaleString('en-US');
  return Math.round(n).toString();
};
const pct = x => Math.round(100 * x) + '%';

function brief(S, r) {
  const prev = S.rec[S.rec.length - 1], L = S.L, out = [];
  const ev = (S.W.events || []).filter(e => e.year === r.year);
  ev.forEach(e => out.push({who: 'news', text: e.text}));
  L.forEach((l, i) => {
    if (r.open[i] && prev && !prev.open[i]) out.push({who: 'news', text: `${l.name} opens: ${fmt(r.enrol[i])} pupils in its first year.`});
  });
  if (r.catchup > 0) out.push({who: 'news', text: `${fmt(r.catchup)} older children who had never enrolled arrive at once.`});
  if (prev) {
    const db = r.births / prev.births - 1;
    if (Math.abs(db) > 0.04) out.push({who: 'statistician', text: `Births ${db > 0 ? 'rose' : 'fell'} ${pct(Math.abs(db))} this year. These children reach Grade 1 in ${r.year + S.W.entry_age}.`});
    const ent = r.entrants / Math.max(prev.entrants, 1) - 1;
    if (prev.catchup > 0 && ent < 0) out.push({who: 'statistician', text: 'Grade 1 intake falls back to normal now that the catch-up wave has entered; that wave moves up one grade a year.'});
    else if (Math.abs(ent) > 0.05) out.push({who: 'statistician', text: `Grade 1 intake ${ent > 0 ? 'up' : 'down'} ${pct(Math.abs(ent))}.`});
  }
  L.forEach((l, i) => {
    if (!r.open[i]) return;
    if (r.shortage[i] > 0.05 * r.required[i]) out.push({who: 'union', text: `${l.name}: ${fmt(r.shortage[i])} teaching posts unfilled; classes average ${Math.round(r.ptr[i])} pupils per teacher.`});
    if (r.surplus[i] > 0.05 * r.required[i]) out.push({who: 'finance', text: `${l.name}: ${fmt(r.surplus[i])} teachers more than the staffing norm needs. They cost ${fmt(r.surplus[i] * r.salary)} a year.`});
    if (r.shifts[i] > 1.15) out.push({who: 'parents', text: `${l.name}: ${pct(r.shifts[i] - 1)} of pupils on a second shift.`});
  });
  if (r.layoffs > 0) out.push({who: 'union', text: `${fmt(r.layoffs)} teachers laid off. The union is mobilising.`});
  if (r.redeployed > 0) out.push({who: 'minister', text: `${fmt(r.redeployed)} teachers retrained and moved to where they are short.`});
  if (r.deficit > 0) out.push({who: 'finance', text: `Committed costs exceed the budget by ${pct(r.deficit / r.budget)}. Arrears now ${fmt(r.arrears)}.`});
  else if (r.salaryShare > 0.85) out.push({who: 'finance', text: `Salaries take ${pct(r.salaryShare)} of the budget; little is left for books.`});
  if (prev && r.qAvg - prev.qAvg < -2) out.push({who: 'inspector', text: `Learning conditions worsened: quality index ${Math.round(prev.qAvg)} → ${Math.round(r.qAvg)}.`});
  if (prev && r.qAvg - prev.qAvg > 2) out.push({who: 'inspector', text: `Learning conditions improved: quality index ${Math.round(prev.qAvg)} → ${Math.round(r.qAvg)}.`});
  if (r.tutorShare > 0.3) out.push({who: 'parents', text: `About ${pct(r.tutorShare)} of teachers sell private lessons to their own pupils.`});
  if (!out.length) out.push({who: 'minister', text: 'A quiet year.'});
  return out;
}

/* ---- replay: compare the run with what was observed. 'input' and 'calibrated' rows are not tests. ---- */
function replay(S) {
  return (S.W.observed || []).map(o => {
    const r = S.rec.find(x => x.year === o.year);
    let v = null;
    if (r) {
      if (o.series === 'enrol') v = r.enrol[o.level];
      else if (o.series === 'ptr') v = r.ptr[o.level];
      else if (o.series === 'entrants') v = r.entrants;
      else if (o.series === 'surplus_at_ref') {     // teachers on payroll minus those needed at the start-year class size
        const r0 = S.rec[0], ref = r0.enrol[o.level] / Math.max(r0.teachers[o.level] + r0.contract[o.level], 1);
        v = r.teachers[o.level] + r.contract[o.level] - r.enrol[o.level] / ref;
      }
    }
    return Object.assign({}, o, {model: v, error: v === null ? null : v / o.value - 1});
  });
}

/* ---- run a whole scenario (for tests and for comparing policies) ---- */
function run(W, policy, until) {
  const S = initWorld(W, policy);
  const end = until || W.end;
  while (S.year <= end) stepWorld(S);
  return S;
}

const API = {path, STRUTS, POLICY, initWorld, stepWorld, run, replay, fmt, pct, project, ageGroup};
if (typeof module !== 'undefined' && module.exports) module.exports = API; else root.AtlasWorld = API;
})(typeof globalThis !== 'undefined' ? globalThis : this);

  for (let t = 0; t < Y; t++) {
    const w = clamp(t / Math.max(1, o.targetYear), 0, 1);
    const intakeRate = lerp(o.intake0, o.intakeT, w), rep = lerp(o.rep0, o.repT, w), drop = lerp(o.drop0, o.dropT, w);
    const ptr = lerp(o.ptr0, o.ptrT, w), salary = lerp(o.salary0, o.salaryT, w), nonsal = lerp(o.nonsal0, o.nonsalT, w);
    const pupils = sum(E), school = sum(Array.from({length: n}, (_, g) => popAge(t, o.entryAge + g)));
    const teachers = pupils / ptr;
    const roomsNeeded = pupils / (o.classSize * o.shifts);
    const newRooms = Math.max(0, roomsNeeded - rooms);
    const gdppc = gdp / o.population(t);
    const salaryBill = teachers * salary * gdppc;
    const recurrent = salaryBill / (1 - nonsal);
    const capital = newRooms * o.roomCost * gdppc;
    const resources = gdp * o.revenue * o.eduShare * o.primaryShare;
    const completers = E[n - 1] * Math.max(0, 1 - rep - drop);
    out.push({t, year: o.startYear + t, enrolment: E.slice(), pupils, ger: pupils / school, intakeRate, teachers, rooms: Math.max(rooms, roomsNeeded),
      newRooms, recurrent, capital, cost: recurrent + capital, resources, gap: recurrent + capital - resources,
      completionRate: completers / popAge(t, o.entryAge + n), unitCostShareGDPpc: recurrent / pupils / gdppc, gdp});
    // flows to next year
    const promote = 1 - rep - drop;
    const entrants = intakeRate * popAge(t + 1, o.entryAge);
    const next = E.map((e, g) => e * rep + (g ? E[g - 1] * promote : entrants));
    pupilBalance.push(sum(next) - (pupils + entrants - pupils * drop - E[n - 1] * promote));
    E = next; rooms = Math.max(rooms, roomsNeeded); gdp *= 1 + o.growth;
  }
  return {rows: out, pupilBalance};
}

/* 5. Teacher demand and supply, age-structured. Stock by single age 22..64; exit rates by age (quits young,
   retirement at `retire`). Requirement path given. New requirement = growth + replacement. Supply = trainees graduating
   after `lag` years (intake capacity can grow at most `capGrowth` a year toward the need) times the absorption rate. */
function teacherProjection(o) {
  const A0 = 22, A1 = o.retire, ages = A1 - A0, out = [];
  let stock = o.initialByAge.slice(0, ages);
  const pipe = new Array(o.lag).fill(o.intake0 * o.completion);
  let intake = o.intake0;
  for (let t = 0; t < o.years; t++) {
    const total = sum(stock), req = o.required(t);
    const exitsByAge = stock.map((s, i) => s * o.exitRate(A0 + i));
    const exits = sum(exitsByAge) + stock[ages - 1] * (1 - o.exitRate(A1 - 1));   // last age retires
    const graduates = pipe.shift();
    const hires = Math.min(graduates * o.absorption, Math.max(0, o.required(t + 1) - (total - exits)));
    const unemployedGrads = graduates * o.absorption - hires;
    // ageing
    const next = new Array(ages).fill(0);
    for (let i = 0; i < ages - 1; i++) next[i + 1] = stock[i] - exitsByAge[i];
    next[0] += hires * 0.6; next[1] += hires * 0.4;                                      // new teachers aged 22-23
    // next intake toward expected need `lag` years ahead, bounded by capacity growth
    const futureNeed = Math.max(0, o.required(t + o.lag) - o.required(t + o.lag - 1)) + exits;
    const wanted = futureNeed / Math.max(o.completion * o.absorption, 1e-9);
    intake = clamp(wanted, intake * (1 - o.capGrowth), intake * (1 + o.capGrowth));
    pipe.push(intake * o.completion);
    const balance = sum(next) - (total - exits + hires);
    out.push({t, year: o.startYear + t, required: req, stock: total, gap: req - total, exits, hires, graduates, unemployedGrads, balance,
      intake, attritionRate: exits / Math.max(total, 1e-9), over50: sum(stock.slice(50 - A0)) / Math.max(total, 1e-9)});
    stock = next;
  }
  return {rows: out, finalByAge: stock};
}

/* 6. Teacher deployment consistency (education sector analysis guidelines): across schools, regress teachers on
   pupils; R^2 measures how consistently teachers follow pupils, 1 - R^2 the share of allocation unrelated to enrolment.
   A reallocation moves a share k of each school's deviation from the proportional norm, keeping the total fixed. */
function deployment(o) {
  const r = rng(o.seed || 7), N = o.schools || 200, out = {pupils: [], teachers: []};
  for (let i = 0; i < N; i++) {
    const p = Math.round(Math.exp(Math.log(o.meanPupils || 260) + (o.spread || 0.6) * normal(r)));
    const ideal = p / o.ptr;
    // a share `randomness` of each school's staffing is unrelated to its enrolment (an average post, scaled by noise)
    const t = ideal * (1 - o.randomness) + o.randomness * ((o.meanPupils || 260) / o.ptr) * Math.exp(0.6 * normal(r));
    out.pupils.push(p); out.teachers.push(t);
  }
  const before = fitR2(out.pupils, out.teachers);
  const T = sum(out.teachers), P = sum(out.pupils);
  const norm = out.pupils.map(p => p * T / P);
  const after = out.teachers.map((t, i) => t + (o.reallocate || 0) * (norm[i] - t));
  const moved = 0.5 * sum(out.teachers.map((t, i) => Math.abs(after[i] - t)));
  return {pupils: out.pupils, teachers: out.teachers, after, r2Before: before.r2, r2After: fitR2(out.pupils, after).r2, slope: before.b, intercept: before.a,
    moved, totalBefore: T, totalAfter: sum(after),
    shareOverPTR: out.pupils.filter((p, i) => p / out.teachers[i] > o.ptr * 1.25).length / N,
    shareOverPTRAfter: out.pupils.filter((p, i) => p / after[i] > o.ptr * 1.25).length / N};
}
function fitR2(x, y) {
  const n = x.length, mx = sum(x) / n, my = sum(y) / n;
  let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < n; i++) { sxy += (x[i] - mx) * (y[i] - my); sxx += (x[i] - mx) ** 2; syy += (y[i] - my) ** 2; }
  const b = sxy / sxx, a = my - b * mx;
  return {a, b, r2: syy > 0 ? (sxy * sxy) / (sxx * syy) : 1};
}

/* 7. Distribution of public education resources across a cohort (education sector analysis, equity chapter).
   Each person's cumulative public spending = sum over levels attended of years x unit cost. Lorenz curve over people
   ordered by spending; Gini; share appropriated by the 10% most educated. */
function resourceDistribution(o) {
  // o.levels: [{name, years, unitCost}] in order; o.terminal: share whose highest level is each level (plus `none`)
  const groups = [{name: 'Never enrolled', share: o.none, spend: 0}];
  let cum = 0;
  o.levels.forEach((l, i) => { cum += l.years * l.unitCost; groups.push({name: l.name, share: o.terminal[i], spend: cum}); });
  const tot = sum(groups.map(g => g.share));
  groups.forEach(g => { g.share /= tot; });
  const total = sum(groups.map(g => g.share * g.spend));
  const lorenz = [[0, 0]]; let cp = 0, cs = 0;
  for (const g of groups) { cp += g.share; cs += g.share * g.spend / total; lorenz.push([cp, cs]); }
  let area = 0; for (let i = 1; i < lorenz.length; i++) area += (lorenz[i][0] - lorenz[i - 1][0]) * (lorenz[i][1] + lorenz[i - 1][1]) / 2;
  // share held by the top 10% (from the top of the distribution down)
  let need = 0.10, top = 0;
  for (let i = groups.length - 1; i >= 0 && need > 1e-12; i--) { const take = Math.min(need, groups[i].share); top += take * groups[i].spend / total; need -= take; }
  return {groups, lorenz, gini: 1 - 2 * area, top10: top, totalPerPerson: total};
}

/* 8. School mapping / micro-planning: villages on a plane; each child attends the nearest school. Greedy p-median adds
   one school at a time at the candidate site that most reduces total child-km (Teitz-Bart style). Never increases any
   child's distance. */
function schoolMap(o) {
  const r = rng(o.seed || 11), V = [];
  for (let i = 0; i < (o.villages || 60); i++) {
    const cl = i % 4, cx = [25, 70, 40, 80][cl], cy = [30, 25, 70, 75][cl];
    V.push({x: clamp(cx + 14 * normal(r), 2, 98), y: clamp(cy + 14 * normal(r), 2, 98), kids: Math.round(Math.exp(3.6 + 0.8 * normal(r)))});
  }
  const schools = (o.existing || [[50, 50]]).map(([x, y]) => ({x, y, built: false}));
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y) * (o.kmPerUnit || 0.3);
  const assign = S => V.map(v => Math.min(...S.map(s => dist(v, s))));
  const stats = S => { const d = assign(S), kids = sum(V.map(v => v.kids));
    return {mean: sum(d.map((x, i) => x * V[i].kids)) / kids, beyond: sum(d.map((x, i) => x > o.maxKm ? V[i].kids : 0)) / kids, d}; };
  const history = [stats(schools)];
  for (let k = 0; k < (o.add || 0); k++) {
    let best = null, bestVal = Infinity;
    const cands = o.rule === 'largest' ? V.slice().sort((a, b) => b.kids - a.kids).filter(v => !schools.some(s => s.x === v.x && s.y === v.y)).slice(0, 1) : V;
    for (const c of cands) {
      const S = schools.concat([{x: c.x, y: c.y}]);
      const d = assign(S); const val = sum(d.map((x, i) => x * V[i].kids));
      if (val < bestVal) { bestVal = val; best = c; }
    }
    schools.push({x: best.x, y: best.y, built: true});
    history.push(stats(schools));
  }
  return {villages: V, schools, history};
}

/* 9. Learning-adjusted years of schooling (World Bank HCI): LAYS = EYS x HLO / 625. Learning poverty: share of
   children at the end-primary age who cannot read with comprehension, counting out-of-school children as not
   proficient: LP = OOS + (1 - OOS) x (1 - BMP). */
function learningAdjusted(o) {
  const lays = o.eys * o.hlo / 625;
  return {lays, lostYears: o.eys - lays, learningPoverty: o.oos + (1 - o.oos) * (1 - o.bmp)};
}

/* 10. Feasibility of a target on a logistic S-curve (Clemens 2004, The long walk to school): coverage x(t) follows
   logistic growth with speed beta. Given today's x0 and a speed, when is the target reached? What speed would the
   deadline need? */
function logisticTarget(o) {
  const L = o.ceiling || 1, x0 = clamp(o.x0, 1e-4, L - 1e-4), xt = clamp(o.target, 1e-4, L - 1e-4);
  const logit = x => Math.log(x / (L - x));
  const yearsNeeded = (logit(xt) - logit(x0)) / o.beta;
  const betaNeeded = (logit(xt) - logit(x0)) / Math.max(o.deadline - o.startYear, 1e-9);
  const path = []; for (let t = 0; t <= (o.horizon || 40); t++) path.push([o.startYear + t, L / (1 + Math.exp(-(logit(x0) + o.beta * t)))]);
  return {yearsNeeded, yearReached: o.startYear + yearsNeeded, betaNeeded, path};
}

/* 11. External efficiency: graduate output against graduate-job openings. Openings grow with output growth x the
   employment elasticity x the growth of the skilled share; unabsorbed graduates join a queue that clears at `clear`
   a year (to other work, migration, or leaving the labour force). */
function absorption(o) {
  const rows = []; let jobs = o.jobs0, queue = o.queue0 || 0, grads = o.grads0;
  for (let t = 0; t < o.years; t++) {
    const openings = jobs * o.replacement + (t ? jobs - rows[t - 1].jobs : 0);
    const hired = Math.min(openings, grads + queue);
    const unabsorbed = grads + queue - hired;
    rows.push({year: o.startYear + t, grads, jobs, openings, hired, queue, ratio: openings / grads});
    queue = unabsorbed * (1 - o.clear);
    jobs *= 1 + o.gdpGrowth * o.elasticity + o.skillShift;
    grads *= 1 + o.gradGrowth;
  }
  return rows;
}

/* 12. UIS indicator calculator: GER, NER, GIR, adjusted gender parity index (UIS: F/M if F <= M, else 2 - M/F),
   pupil-teacher ratio, percentage of trained teachers. */
function indicators(o) {
  const gpi = (f, m) => f <= m ? f / m : 2 - m / f;
  const gerF = o.enrolF / o.popF, gerM = o.enrolM / o.popM;
  return {ger: (o.enrolF + o.enrolM) / (o.popF + o.popM), gerF, gerM, ner: (o.ofAgeF + o.ofAgeM) / (o.popF + o.popM),
    gpiRaw: gerF / gerM, gpiAdj: gpi(gerF, gerM), gir: o.newEntrants / o.popEntry, ptr: (o.enrolF + o.enrolM) / o.teachers,
    trained: o.trained / o.teachers, pqtr: (o.enrolF + o.enrolM) / o.trained, overAge: 1 - (o.ofAgeF + o.ofAgeM) / (o.enrolF + o.enrolM)};
}

/* 13. School grant formula: allocate a budget across schools by per-pupil weight plus equity weights (poverty,
   remoteness) and a fixed base per school. Every unit of budget is allocated (identity). */
function grantFormula(o) {
  const r = rng(o.seed || 5), S = [];
  for (let i = 0; i < (o.schools || 120); i++) S.push({pupils: Math.round(Math.exp(5.3 + 0.7 * normal(r))), poverty: clamp(0.4 + 0.25 * normal(r), 0, 1), remote: r() < 0.3 ? 1 : 0});
  const base = o.baseShare * o.budget / S.length;
  const pts = S.map(s => s.pupils * (1 + o.wPoverty * s.poverty + o.wRemote * s.remote));
  const pool = o.budget * (1 - o.baseShare), P = sum(pts);
  S.forEach((s, i) => { s.grant = base + pool * pts[i] / P; s.perPupil = s.grant / s.pupils; });
  const sorted = S.slice().sort((a, b) => a.poverty - b.poverty), q = Math.floor(S.length / 5);
  const pp = arr => sum(arr.map(s => s.grant)) / sum(arr.map(s => s.pupils));
  return {schools: S, allocated: sum(S.map(s => s.grant)), poorestQuintilePerPupil: pp(sorted.slice(-q)), richestQuintilePerPupil: pp(sorted.slice(0, q)),
    smallSchoolPerPupil: pp(S.filter(s => s.pupils < 120)), largeSchoolPerPupil: pp(S.filter(s => s.pupils >= 400))};
}

const api = {flowRates, cohort, populationProjection, sectorSimulation, teacherProjection, deployment, fitR2, resourceDistribution,
  schoolMap, learningAdjusted, logisticTarget, absorption, indicators, grantFormula};
if (typeof module !== 'undefined') module.exports = api;
root.AtlasLab = api;
})(typeof window !== 'undefined' ? window : globalThis);
