   {k: 'u5', label: 'Survival to age 1', min: .9, max: 1, step: .002, v: .975, f: p1}, {k: 'mig', label: 'Net migration at ages 6–14 (thousands a year)', min: -5, max: 5, step: .5, v: 0, f: v => v + 'k'}],
 presets: [{label: 'Baby bust', v: {bgrowth: -.04}}, {label: 'Echo boom', v: {bgrowth: .03}}, {label: 'Out-migration', v: {mig: -4}}],
 run(v) { const A = 25, Y = 31, init = Array.from({length: A}, (_, a) => v.births0 * Math.pow(1 + v.bgrowth, -a) * Math.pow(.998, a) * (a ? v.u5 : 1));
   const P = L.populationProjection({ages: A, years: Y, initial: init, births: t => v.births0 * Math.pow(1 + v.bgrowth, t), survival: a => a === 0 ? v.u5 : .998, migration: (a) => a >= 6 && a <= 14 ? v.mig / 9 : 0});
   const lvl = (t, a0, a1) => sum(P.pop[t].slice(a0, a1 + 1)), yrs = Array.from({length: Y}, (_, t) => 2025 + t);
   const pr = yrs.map((y, t) => [y, lvl(t, 6, 11)]), lo = yrs.map((y, t) => [y, lvl(t, 12, 14)]), up = yrs.map((y, t) => [y, lvl(t, 15, 17)]);
   const peak = pr.reduce((a, b) => b[1] > a[1] ? b : a);
   return {metrics: [['Primary-age (6–11), 2025', H().fmt(1000 * pr[0][1]), 'People'], ['Primary-age, 2040', H().fmt(1000 * pr[15][1]), `${p1(pr[15][1] / pr[0][1] - 1)} on 2025`],
     ['Primary-age peak', peak[0], H().fmt(1000 * peak[1])], ['Mass balance', Math.max(...P.balance.map(Math.abs)).toExponential(1), 'Largest residual, thousands']],
     main: H().lineChart({label: 'school-age population', series: [{name: 'Primary age 6–11', color: 'var(--accent-green)', pts: pr}, {name: 'Lower secondary 12–14', color: 'var(--accent)', pts: lo}, {name: 'Upper secondary 15–17', color: 'var(--rust)', pts: up}], fmt: x => H().fmt(1000 * x)}),
     caption: 'Thousands of children by school-age band. Demand for places moves with these lines, years before any policy choice.'}; }},
{id: 'sector', family: 'Population and enrolment', name: 'Sector simulation', tag: 'Set targets for intake, repetition and dropout; see the teachers, rooms and money they imply.',
 source: 'UNESCO EPSSim and IIEP sector-simulation practice (targets interpolated to a target year; resources from macro-fiscal frame).',
 formula: 'E(1, t+1) = intake rate × P(6, t+1) + r × E(1, t)\nE(g, t+1) = p × E(g−1, t) + r × E(g, t)\nteachers = E / PTR;  rooms = E / (class size × shifts)\nrecurrent = teachers × salary × GDPpc / (1 − non-salary share)\nresources = GDP × revenue/GDP × education share × primary share\ngap = recurrent + capital − resources',
 method: 'A six-grade primary system moving from today’s flow rates to the targets by the target year. The financing gap is reported, never clipped to the budget.',
 limits: 'One level, one region; a policy that cannot be financed still runs, so the gap is the warning. Not a replication of EPSSim workbooks.',
 inputs: [{k: 'intakeT', label: 'Target gross intake rate', min: .8, max: 1.2, step: .01, v: 1.0, f: p1}, {k: 'repT', label: 'Target repetition', min: 0, max: .2, step: .01, v: .03, f: p1},
   {k: 'dropT', label: 'Target dropout', min: 0, max: .1, step: .005, v: .01, f: p1}, {k: 'ptrT', label: 'Target pupils per teacher', min: 25, max: 60, step: 1, v: 40, f: v => v},
   {k: 'salaryT', label: 'Teacher salary (× GDP per capita)', min: 1.5, max: 7, step: .1, v: 3.5, f: v => v.toFixed(1) + '×'}, {k: 'growth', label: 'Real GDP growth', min: 0, max: .1, step: .005, v: .05, f: p1},
   {k: 'eduShare', label: 'Education share of public spending', min: .08, max: .25, step: .005, v: .15, f: p1}, {k: 'popGrowth', label: 'Cohort growth', min: -.03, max: .03, step: .005, v: 0, f: p1}],
 presets: [{label: 'Universal completion by 2035', v: {intakeT: 1.05, repT: .02, dropT: .005}}, {label: 'Smaller classes', v: {ptrT: 30}}, {label: 'Low growth', v: {growth: .02}}, {label: 'Raise teacher pay', v: {salaryT: 5}}],
 run(v) { const pop = demoPop(v.popGrowth);
   const S = L.sectorSimulation({grades: 6, years: 21, E0: [470e3, 400e3, 370e3, 345e3, 320e3, 300e3], rooms0: 42000, gdp0: 4e10, popAge: pop, population: t => 1.7e7 * Math.pow(1 + v.popGrowth * .6, t), entryAge: 6,
     intake0: .92, intakeT: v.intakeT, rep0: .09, repT: v.repT, drop0: .05, dropT: v.dropT, ptr0: 45, ptrT: v.ptrT, salary0: 3.2, salaryT: v.salaryT, nonsal0: .18, nonsalT: .22,
     targetYear: 10, classSize: 45, shifts: 1, roomCost: 6, revenue: .19, eduShare: v.eduShare, primaryShare: .45, growth: v.growth, startYear: 2025});
   const R = S.rows, last = R[R.length - 1], r10 = R[10];
   return {metrics: [['Primary completion, 2035', p1(r10.completionRate), `GER ${p1(r10.ger)}`], ['Teachers needed, 2035', H().fmt(r10.teachers), `${H().fmt(r10.teachers - R[0].teachers)} more than 2025`],
     ['Financing gap, 2035', (r10.gap >= 0 ? '' : '+') + H().fmt(Math.abs(r10.gap)), r10.gap > 0 ? `${p1(r10.gap / r10.cost)} of cost unfunded` : 'Surplus'], ['Unit cost, 2035', p1(r10.unitCostShareGDPpc), 'Of GDP per capita, per pupil']],
     main: H().lineChart({label: 'cost and resources', series: [{name: 'Total cost', color: 'var(--rust)', pts: R.map(r => [r.year, r.cost])}, {name: 'Resources for primary', color: 'var(--accent-green)', pts: R.map(r => [r.year, r.resources])}, {name: 'Recurrent cost', color: 'var(--accent)', dash: '5 4', pts: R.map(r => [r.year, r.recurrent])}], fmt: H().fmt}),
     caption: `Currency units of a stylised country. Pupils conserved every year (largest residual ${Math.max(...S.pupilBalance.map(Math.abs)).toExponential(1)}).`}; }},
// ---------------------------------------------------------------- teachers
{id: 'teachers', family: 'Teachers', name: 'Teacher supply and demand', tag: 'Ages, retirements and a training pipeline that takes years to respond.',
 source: 'IIEP teacher-projection practice; UIS teacher-gap methodology (new requirement = expansion + attrition).',
 formula: 'new requirement(t) = [req(t+1) − req(t)] + exits(t)\nexits = Σ stock(a) × exit(a) + retirements\nsupply(t) = intake(t − lag) × completion × absorption\nintake moves toward expected need, by at most ±capacity growth a year',
 method: 'An age-structured teaching force (22–59) with higher quitting among young teachers and retirement at 60. Colleges admit trainees who graduate after the lag; intake can only change gradually.',
 limits: 'No subject or regional mismatch; graduates not hired are counted, not modelled as a labour market.',
 inputs: [{k: 'growth', label: 'Growth in teachers required', min: -.04, max: .05, step: .005, v: .02, f: p1}, {k: 'lag', label: 'Training length (years)', min: 1, max: 5, step: 1, v: 4, f: v => v},
   {k: 'cap', label: 'Max change in college intake a year', min: .02, max: .4, step: .01, v: .1, f: p1}, {k: 'youngQuit', label: 'Quit rate under 30', min: .01, max: .15, step: .005, v: .06, f: p1},
   {k: 'ageing', label: 'Age profile of today’s teachers', min: 0, max: 1, step: .05, v: .5, f: v => v < .34 ? 'young' : v > .66 ? 'old' : 'mixed'}],
 presets: [{label: 'Retirement wave', v: {ageing: 1, growth: 0}}, {label: 'Falling enrolment', v: {growth: -.03}}, {label: 'Rapid expansion', v: {growth: .045, cap: .1}}],
 run(v) { const ages = 38, init = Array.from({length: ages}, (_, i) => 1000 * (1 + v.ageing * (i / ages - .5) * 1.6));
   const T = L.teacherProjection({years: 26, retire: 60, initialByAge: init, lag: v.lag, intake0: 3000, completion: .85, absorption: .9, capGrowth: v.cap,
     required: t => sum(init) * Math.pow(1 + v.growth, t), exitRate: a => a < 30 ? v.youngQuit : a > 55 ? .04 : .015, startYear: 2025});
   const R = T.rows, worst = R.reduce((a, b) => b.gap > a.gap ? b : a);
   return {metrics: [['Largest shortage', H().fmt(Math.max(0, worst.gap)), Math.max(0, worst.gap) > 0 ? 'in ' + worst.year : 'None'], ['Attrition, first year', p1(R[0].attritionRate), 'Exits / stock'],
     ['Trained but not hired, total', H().fmt(sum(R.map(r => r.unemployedGrads))), 'Graduates of teacher colleges'], ['Teachers over 50, 2050', p1(R[R.length - 1].over50), `Today ${p1(R[0].over50)}`]],
     main: H().lineChart({label: 'teachers', series: [{name: 'Required', color: 'var(--rust)', dash: '5 4', pts: R.map(r => [r.year, r.required])}, {name: 'In post', color: 'var(--accent-green)', pts: R.map(r => [r.year, r.stock])}, {name: 'College intake ×10', color: 'var(--accent)', pts: R.map(r => [r.year, 10 * r.intake])}], fmt: H().fmt}),
     caption: 'Teachers. The pipeline’s lag and capacity limit make shortages and gluts follow each other.'}; }},
{id: 'deployment', family: 'Teachers', name: 'Teacher deployment', tag: 'Do teachers follow pupils? The R² test from education sector analysis.',
 source: 'Education sector analysis guidelines (UNESCO IIEP, World Bank, UNICEF, GPE), volume 1: consistency of teacher allocation.',
 formula: 'teachers(i) = a + b × pupils(i) + e(i)\nR² = share of variation in teachers explained by enrolment\n1 − R² = degree of randomness in allocation',
 method: 'Two hundred synthetic schools. A share of each school’s staffing is unrelated to its pupils. A reallocation moves each school part of the way to the proportional norm with the same total of teachers.',
 limits: 'Synthetic schools; real reallocation faces housing, language, subject and remoteness constraints.',
 inputs: [{k: 'randomness', label: 'Staffing unrelated to enrolment', min: 0, max: .9, step: .05, v: .45, f: p1}, {k: 'reallocate', label: 'Reallocation toward the norm', min: 0, max: 1, step: .05, v: 0, f: p1},
   {k: 'ptr', label: 'Norm: pupils per teacher', min: 25, max: 60, step: 1, v: 40, f: v => v}],
 presets: [{label: 'Disorderly allocation', v: {randomness: .8, reallocate: 0}}, {label: 'Move half the deviation', v: {randomness: .6, reallocate: .5}}],
 run(v) { const D = L.deployment({ptr: v.ptr, randomness: v.randomness, reallocate: v.reallocate, schools: 200});
   const W = 760, Hh = 300, mx = Math.max(...D.pupils), my = Math.max(...D.teachers, ...D.after) * 1.05;
   const X = x => 46 + x / mx * (W - 60), Y = y => 12 + (1 - y / my) * (Hh - 40);
   const pts = (arr, c) => D.pupils.map((p, i) => `<circle cx="${X(p)}" cy="${Y(arr[i])}" r="3" fill="${c}" opacity=".7"/>`).join('');
   const svg = `<svg class="line-chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="teachers against pupils"><line x1="${X(0)}" y1="${Y(0)}" x2="${X(mx)}" y2="${Y(mx / v.ptr)}" stroke="var(--line)" stroke-dasharray="4 4"/>
     ${pts(D.teachers, 'var(--rust)')}${v.reallocate > 0 ? pts(D.after, 'var(--accent-green)') : ''}<text x="${W - 16}" y="${Hh - 10}" text-anchor="end" class="axis">pupils per school →</text><text x="50" y="22" class="axis">teachers ↑</text></svg>
     <div class="chart-legend"><span><b style="color:var(--rust)">●</b>Before</span>${v.reallocate > 0 ? '<span><b style="color:var(--accent-green)">●</b>After reallocation</span>' : ''}<span><i style="background:var(--line)"></i>Norm</span></div>`;
   return {metrics: [['R², today', D.r2Before.toFixed(2), `${p1(1 - D.r2Before)} of allocation unrelated to pupils`], ['R², after', D.r2After.toFixed(2), `${H().fmt(D.moved)} teachers moved`],
     ['Schools 25% above the norm', p1(D.shareOverPTR), `After: ${p1(D.shareOverPTRAfter)}`], ['Teachers in total', H().fmt(D.totalAfter), 'Unchanged by reallocation']], main: svg,
     caption: 'Each dot is a school.'}; }},
// ---------------------------------------------------------------- money and equity
{id: 'equity', family: 'Money and equity', name: 'Who gets public spending', tag: 'Lorenz curve of public education resources across a cohort.',
 source: 'Education sector analysis guidelines, equity chapter (distribution of public resources by terminal level of schooling).',
 formula: 'spending(person) = Σ over levels attended of years × public unit cost\nshare to the most educated 10% = their cumulative spending / total\nGini = 1 − 2 × area under the Lorenz curve',
 method: 'A cohort is split by the highest level each person reaches. Each level’s unit cost is a multiple of GDP per capita; people who go further consume more public money.',
 limits: 'Public spending only; household spending, private schools and the value of instruction received are outside it.',
 inputs: [{k: 'none', label: 'Never enrolled', min: 0, max: .3, step: .01, v: .06, f: p1}, {k: 'pri', label: 'Stop after primary', min: .05, max: .7, step: .01, v: .40, f: p1},
   {k: 'lsec', label: 'Stop after lower secondary', min: 0, max: .5, step: .01, v: .26, f: p1}, {k: 'usec', label: 'Stop after upper secondary', min: 0, max: .4, step: .01, v: .17, f: p1},
   {k: 'ter', label: 'Reach tertiary', min: 0, max: .5, step: .01, v: .11, f: p1}, {k: 'terCost', label: 'Tertiary unit cost (× GDP per capita)', min: .2, max: 4, step: .1, v: 1.2, f: v => v.toFixed(1) + '×'}],
 presets: [{label: 'Elite tertiary', v: {none: .15, pri: .5, lsec: .2, usec: .1, ter: .05, terCost: 3}}, {label: 'Mass tertiary, low unit cost', v: {none: .02, pri: .15, lsec: .2, usec: .3, ter: .33, terCost: .4}}],
 run(v) { const R = L.resourceDistribution({none: v.none, levels: [{name: 'Primary', years: 6, unitCost: .10}, {name: 'Lower secondary', years: 3, unitCost: .15}, {name: 'Upper secondary', years: 3, unitCost: .22}, {name: 'Tertiary', years: 4, unitCost: v.terCost}], terminal: [v.pri, v.lsec, v.usec, v.ter]});
   const ter = R.groups[R.groups.length - 1];
   return {metrics: [['Gini of public spending', R.gini.toFixed(2), '0 = everyone gets the same'], ['Most educated 10% receive', p1(R.top10), 'Of the cohort’s public spending'],
     ['Per tertiary graduate', (ter.spend / R.totalPerPerson).toFixed(1) + '×', 'The cohort average'], ['Cohort shares sum to', p1(sum(R.groups.map(g => g.share))), 'Normalised']],
     main: H().lineChart({label: 'Lorenz', xmin: 0, xmax: 1, ymin: 0, ymax: 1, xstep: .2, series: [{name: 'Equal distribution', color: 'var(--line)', dash: '4 4', pts: [[0, 0], [1, 1]]}, {name: 'Lorenz curve', color: 'var(--accent-green)', pts: R.lorenz}], fmt: x => Math.round(100 * x) + '%'}),
     caption: 'Cumulative share of the cohort (ordered from least to most schooling) against cumulative share of public spending.'}; }},
{id: 'grants', family: 'Money and equity', name: 'School grant formula', tag: 'Per-pupil, poverty and remoteness weights: who ends up with what per child.',
 source: 'Capitation and needs-based grant formulas (IIEP research on school grants; Ross & Levačić, Needs-based resource allocation in education).',
 formula: 'grant(i) = base + pool × pupils(i) × [1 + w_pov × poverty(i) + w_rem × remote(i)] / Σ points\nΣ grant(i) = budget',
 method: 'One hundred and twenty synthetic schools. A fixed base per school protects small schools; the rest follows weighted pupils.',
 limits: 'Weights are policy choices, not estimates of need; the formula allocates money, not the capacity to use it.',
 inputs: [{k: 'baseShare', label: 'Budget given as an equal base per school', min: 0, max: .6, step: .05, v: .2, f: p1}, {k: 'wPoverty', label: 'Poverty weight', min: 0, max: 3, step: .1, v: .8, f: v => v.toFixed(1)},
   {k: 'wRemote', label: 'Remoteness weight', min: 0, max: 2, step: .1, v: .4, f: v => v.toFixed(1)}],
 presets: [{label: 'Pure capitation', v: {baseShare: 0, wPoverty: 0, wRemote: 0}}, {label: 'Strongly pro-poor', v: {wPoverty: 2.5}}],
 run(v) { const G = L.grantFormula({budget: 1e7, baseShare: v.baseShare, wPoverty: v.wPoverty, wRemote: v.wRemote});
   return {metrics: [['Poorest fifth, per pupil', G.poorestQuintilePerPupil.toFixed(0), 'Currency units'], ['Least poor fifth, per pupil', G.richestQuintilePerPupil.toFixed(0), `Ratio ${(G.poorestQuintilePerPupil / G.richestQuintilePerPupil).toFixed(2)}`],
     ['Small schools (<120), per pupil', G.smallSchoolPerPupil.toFixed(0), `Large (≥400): ${G.largeSchoolPerPupil.toFixed(0)}`], ['Allocated', H().fmt(G.allocated), 'Equals the budget']],
     main: barChart({label: 'per pupil', labels: ['Poorest 20%', 'Least poor 20%', 'Small schools', 'Large schools'], values: [G.poorestQuintilePerPupil, G.richestQuintilePerPupil, G.smallSchoolPerPupil, G.largeSchoolPerPupil], colors: ['var(--accent-green)', '#7d9ab0', 'var(--accent)', 'var(--rust)']}),
     caption: 'Grant per pupil, currency units.'}; }},
// ---------------------------------------------------------------- access and places
{id: 'schoolmap', family: 'Access and places', name: 'School mapping', tag: 'Where to build the next schools so fewer children walk too far.',
 source: 'IIEP school mapping and micro-planning (Hallak 1977; Caillods); location-allocation (Teitz & Bart greedy p-median).',
 formula: 'distance(child) = min over schools of |village − school|\nadd the site that most reduces Σ children × distance\nshare beyond the threshold = children > max km / all children',
 method: 'Sixty synthetic villages in four clusters, one existing school. Each new school goes either where it most reduces total walking (greedy p-median) or in the largest village not yet served.',
 limits: 'Straight-line distance; rivers, roads, school size and safety are ignored.',
 inputs: [{k: 'add', label: 'New schools', min: 0, max: 12, step: 1, v: 4, f: v => v}, {k: 'maxKm', label: 'Acceptable walk (km)', min: 1, max: 6, step: .5, v: 3, f: v => v + ' km'},
   {k: 'rule', label: 'Siting rule', kind: 'opt', v: 'greedy', options: [['greedy', 'Least total walking'], ['largest', 'Largest village']]}],
 presets: [{label: 'Twelve schools, best sites', v: {add: 12, rule: 'greedy'}}, {label: 'Twelve schools, largest villages', v: {add: 12, rule: 'largest'}}],
 run(v) { const M = L.schoolMap({add: v.add, maxKm: v.maxKm, rule: v.rule}), h = M.history[M.history.length - 1];
   const W = 760, Hh = 420, X = x => 180 + x * 4, Y = y => 10 + y * 4;   // equal scale on both axes
   const svg = `<svg class="line-chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="school map"><rect x="176" y="6" width="408" height="408" fill="var(--land)" rx="4"/><text x="584" y="418" text-anchor="end" class="axis">30 km</text>
     ${M.villages.map((vl, i) => `<circle cx="${X(vl.x)}" cy="${Y(vl.y)}" r="${2 + Math.sqrt(vl.kids) / 2.2}" fill="${h.d[i] > v.maxKm ? 'var(--rust)' : 'var(--accent-green)'}" opacity=".55"><title>${vl.kids} children · ${h.d[i].toFixed(1)} km</title></circle>`).join('')}
     ${M.schools.map(s => `<path transform="translate(${X(s.x) - 10} ${Y(s.y) - 10})" d="M0 7 L10 0 L20 7 V21 H2 V7 Z" fill="${s.built ? 'var(--accent)' : 'var(--ink-strong)'}" stroke="var(--panel)"/>`).join('')}</svg>
     <div class="chart-legend"><span><b style="color:var(--accent-green)">●</b>Village within ${v.maxKm} km</span><span><b style="color:var(--rust)">●</b>Beyond</span><span><b style="color:var(--accent)">■</b>New school</span><span><b>■</b>Existing</span></div>`;
   return {metrics: [['Mean walk', h.mean.toFixed(2) + ' km', `Before: ${M.history[0].mean.toFixed(2)} km`], ['Children beyond ' + v.maxKm + ' km', p1(h.beyond), `Before: ${p1(M.history[0].beyond)}`],
     ['Schools', M.schools.length, `${v.add} new`], ['Rule', v.rule === 'greedy' ? 'Least walking' : 'Largest village', 'Change it to compare']], main: svg, caption: 'Circle size = children in the village.'}; }},
// ---------------------------------------------------------------- learning and targets
{id: 'lays', family: 'Learning and targets', name: 'Learning-adjusted years', tag: 'Years in school are not years of learning: LAYS and learning poverty.',
 source: 'World Bank Human Capital Index (LAYS) and learning-poverty indicator; harmonised learning outcomes on a 300–625 scale.',
 formula: 'LAYS = expected years of schooling × HLO / 625\nlearning poverty = OOS + (1 − OOS) × (1 − share at minimum proficiency)',
 method: 'Converts expected schooling into years of learning at a benchmark quality, and counts out-of-school children as not proficient.',
 limits: 'The 625 benchmark is a convention; HLO harmonises different tests with error; learning poverty uses end-of-primary reading, not secondary.',
 inputs: [{k: 'eys', label: 'Expected years of schooling', min: 4, max: 14, step: .1, v: 9.5, f: v => v.toFixed(1)}, {k: 'hlo', label: 'Harmonised test score', min: 300, max: 625, step: 5, v: 450, f: v => v},
   {k: 'oos', label: 'Out of school at end-primary age', min: 0, max: .5, step: .01, v: .08, f: p1}, {k: 'bmp', label: 'Pupils reading at minimum proficiency', min: 0, max: 1, step: .01, v: .3, f: p1}],
 presets: [{label: 'More years, same learning', v: {eys: 12}}, {label: 'Same years, better learning', v: {hlo: 540, bmp: .6}}],
 run(v) { const A = L.learningAdjusted(v);
   return {metrics: [['Learning-adjusted years', A.lays.toFixed(1), `Of ${v.eys.toFixed(1)} expected years`], ['Years lost to low learning', A.lostYears.toFixed(1), p1(A.lostYears / v.eys) + ' of schooling'],
     ['Learning poverty', p1(A.learningPoverty), 'Cannot read with comprehension at 10'], ['Gain from +50 points', (v.eys * 50 / 625).toFixed(2) + ' yrs', 'Same years in school']],
     main: barChart({label: 'years', labels: ['Expected years', 'Learning-adjusted', 'Lost'], values: [v.eys, A.lays, A.lostYears], max: 14, fmt: x => x.toFixed(1), colors: ['#7d9ab0', 'var(--accent-green)', 'var(--rust)']}),
     caption: 'Cambodia’s PISA-D (2017) found 8% of 15-year-olds at minimum reading proficiency and 10% in maths — a different age and test from learning poverty’s end-primary measure.'}; }},
{id: 'logistic', family: 'Learning and targets', name: 'Is the deadline realistic?', tag: 'Coverage grows along an S-curve: the speed a target needs against the speed countries have achieved.',
 source: 'Clemens (2004), The Long Walk to School: International Education Goals in Historical Perspective, Center for Global Development WP 37.',
 formula: 'x(t) = 1 / (1 + exp(−(logit x0 + β t)))\nyears to target = [logit(target) − logit(x0)] / β\nβ needed = [logit(target) − logit(x0)] / years to deadline',
 method: 'Places today’s completion rate on a logistic path. Compare the speed the deadline requires with a historical speed you choose.',
 limits: 'The logistic shape is an empirical regularity, not a law; policy shocks such as fee abolition can produce jumps.',
 inputs: [{k: 'x0', label: 'Completion today', min: .2, max: .95, step: .01, v: .6, f: p1}, {k: 'target', label: 'Target', min: .5, max: .99, step: .01, v: .95, f: p1},
   {k: 'deadline', label: 'Deadline', min: 2027, max: 2050, step: 1, v: 2030, f: v => v}, {k: 'beta', label: 'Assumed speed β (logit points a year)', min: .02, max: .4, step: .01, v: .12, f: v => v.toFixed(2)}],
 presets: [{label: 'SDG 2030 completion', v: {x0: .6, target: .95, deadline: 2030}}, {label: 'Fast historical pace', v: {beta: .25}}],
 run(v) { const G = L.logisticTarget({x0: v.x0, target: v.target, beta: v.beta, deadline: v.deadline, startYear: 2025, horizon: 40});

const avgLast = (R, g, k, i) => { const L = R.rows.slice(-4); return L.reduce((s, x) => s + (i === undefined ? x[g][k] : x[g][k][i]), 0) / L.length; };

function ladder(R, t, reg) {
  const row = R.rows[t], H = R.H, W = 520, top = 6, rh = 17, left = 34, cols = 40, cw = (W - left - 4) / cols;
  const states = ['school', 'both', 'work', 'migr', 'neither'];
  let svg = `<svg viewBox="0 0 ${W} ${top + rh * 12 + 18}" class="cc-ladder" role="img" aria-label="What children do at each age in ${row.year}">`;
  for (let a = 6; a <= 17; a++) {
    const c = {school: 0, both: 0, work: 0, migr: 0, neither: 0}; let n = 0;
    for (let i = 0; i < H.length; i++) { if (H[i].reg !== reg || row.age[i] !== a) continue; n++; const s = row.choice[i]; c[s === 'work' && row.migr[i] ? 'migr' : s]++; }
    const y = top + (a - 6) * rh;
    svg += `<text x="${left - 8}" y="${y + rh / 2 + 4}" text-anchor="end" class="cc-axis">${a}</text>`;
    const raw = states.map(s => n ? c[s] / n * cols : 0), fl = raw.map(Math.floor);
    let used = fl.reduce((s, v) => s + v, 0);
    raw.map((v, i) => [v - fl[i], i]).sort((p, q) => q[0] - p[0]).forEach(([, i]) => { if (used < cols) { fl[i]++; used++; } });
    let j = 0;
    states.forEach((s, si) => { for (let m = 0; m < fl[si]; m++, j++) svg += `<rect x="${(left + j * cw).toFixed(1)}" y="${y + 2}" width="${(cw - 2).toFixed(1)}" height="${rh - 5}" rx="2" fill="var(--cc-${s})"/>`; });

function region(reg) {

      s += `<polyline points="${poly(B.map(x => x[2]))}" fill="none" stroke="${c}" stroke-width="2.5"/>`;

    });
  } else lines.forEach(se => {
    s += `<polyline points="${poly(se.R.rows.map(x => x[se.g].cl))}" fill="none" stroke="${se.c}" stroke-width="${se.dash ? 1.4 : 2.5}" stroke-dasharray="${se.dash ? '5 4' : ''}"/>`;
    if (se.name) { const v = se.R.rows[n - 1][se.g].cl; s += `<circle cx="${X(n - 1)}" cy="${Y(v)}" r="3.5" fill="${se.c}"/><text x="${X(n - 1) + 8}" y="${Y(v) + 4}" class="cc-label">${se.name} ${pct(v)}</text>`; }

  document.getElementById('cc-chartnote').textContent = MC ? `Median, 50% and 90% bands over ${root.CamChildRuns.seeds} seeds · dashed: no policy` : 'One live run · dashed: no policy';

  else if (S.active === 'base') P.textContent = `Bands show chance alone: the same policy on different random draws of families, shocks and abilities.`;

}

// ------------------------------------------------------------------ a small SVG line chart
function lineChart(o) {
  const Wd = 760, H = o.height || 300, L = 46, Rm = 14, Tp = 12, B = 28;
  const all = [].concat(...o.series.map(s => s.pts), ...(o.dots || []).map(d => d.pts)).filter(p => Number.isFinite(p[1]));
  if (!all.length) return '<p class="chart-empty">No data</p>';
  const xmin = o.xmin ?? Math.min(...all.map(p => p[0])), xmax = o.xmax ?? Math.max(...all.map(p => p[0]));
  let ymin = o.ymin ?? Math.min(...all.map(p => p[1])), ymax = o.ymax ?? Math.max(...all.map(p => p[1]));
  if (ymax === ymin) { ymax += 1; ymin -= 1; }
  const pad = (ymax - ymin) * 0.06; if (o.ymin === undefined) ymin -= pad; ymax += pad;
  const X = x => L + (x - xmin) / (xmax - xmin) * (Wd - L - Rm), Y = y => Tp + (ymax - y) / (ymax - ymin) * (H - Tp - B);
  const step = niceStep((ymax - ymin) / 5), ticks = [];
  for (let v = Math.ceil(ymin / step) * step; v <= ymax + 1e-9; v += step) ticks.push(v);
  const xt = []; const xs = o.xstep || Math.max(1, Math.round((xmax - xmin) / 8));
  for (let v = Math.ceil(xmin); v <= xmax; v += xs) xt.push(v);
  const yf = o.fmt || (v => +v.toFixed(2));
  const path = pts => { let d = '', pen = false; for (const [x, y] of pts) { if (!Number.isFinite(y)) { pen = false; continue; } d += (pen ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(y).toFixed(1); pen = true; } return d; };
  return `<svg class="line-chart" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="${esc(o.label || 'chart')}">
   ${(o.bands || []).map(b => `<rect x="${X(b[0])}" y="${Tp}" width="${X(b[1]) - X(b[0])}" height="${H - Tp - B}" fill="var(--panel-2)"/>`).join('')}
   ${ticks.map(v => `<line x1="${L}" x2="${Wd - Rm}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" class="axis">${yf(v)}</text>`).join('')}
   ${xt.map(v => `<text x="${X(v)}" y="${H - 8}" text-anchor="middle" class="axis">${v}</text>`).join('')}
   ${(o.marks || []).map(m => `<line x1="${X(m[0])}" x2="${X(m[0])}" y1="${Tp}" y2="${H - B}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${X(m[0]) + 4}" y="${Tp + 11}" class="axis">${esc(m[1])}</text>`).join('')}
   ${o.series.map(s => `<path d="${path(s.pts)}" fill="none" stroke="${s.color}" stroke-width="${s.w || 2.2}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ''} stroke-linejoin="round"/>`).join('')}
   ${(o.dots || []).map(d => d.pts.map(p => d.shape === 'x'
      ? `<path d="M${X(p[0]) - 3.5} ${Y(p[1]) - 3.5}l7 7m0 -7l-7 7" stroke="${d.color}" stroke-width="1.6"><title>${d.name}: ${p[1]}</title></path>`
      : `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3.3" fill="${d.color}"><title>${d.name}: ${p[1]}</title></circle>`).join('')).join('')}
  </svg><div class="chart-legend">${o.series.map(s => `<span><i style="background:${s.color}${s.dash ? ';opacity:.6' : ''}"></i>${esc(s.name)}</span>`).join('')}${(o.dots || []).map(d => `<span><b style="color:${d.color}">${d.shape === 'x' ? '×' : '●'}</b>${esc(d.name)}</span>`).join('')}</div>`;
}
function niceStep(r) { const p = Math.pow(10, Math.floor(Math.log10(r))); const n = r / p; return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p; }

  const P = st.S.P, struts = st.S.struts;

  const S = AW.initWorld(st.S.W, Object.assign({}, P, {struts})); AW.stepWorld(S);

function categoryMatrix(F) {

   ${fams.map(f => `<section class="lab-family"><p class="overline">${esc(f.toUpperCase())}</p><div class="scenario-grid">${TOOLS().filter(t => t.family === f).map(t => `<button class="scenario-card lab-card" data-act="tool" data-v="${t.id}">
     <div class="scenario-top"><span>${String(TOOLS().indexOf(t) + 1).padStart(2, '0')} / TOOL</span><span>${t.presets.length} demos</span></div>
     <div class="scenario-body"><h2>${esc(t.name)}</h2><p>${esc(t.tag)}</p></div><div class="scenario-foot"><span>${esc(t.source.split(';')[0])}</span><span class="enter-world">Open ${I.arrow}</span></div></button>`).join('')}</div></section>`).join('')}
   <section class="lab-family"><p class="overline">MODELS THE LAB STILL NEEDS</p><div class="param-table registry"><table><thead><tr><th>Model</th><th>What it would add</th><th>Status</th></tr></thead><tbody>
    ${window.LAB_NEEDED.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div></section>
  </main><footer class="site-footer">${brand(true)}<span>Planning Lab · The Atlas of Education 0.9.1</span><button data-act="modal" data-v="method">Evidence & limitations</button></footer>`;
}
function openTool(id) { const t = TOOLS().find(x => x.id === id); st.tool = t; st.tv = {}; t.inputs.forEach(i => { st.tv[i.k] = i.v; }); }
function toolDynamic() {
  const t = st.tool, R = t.run(st.tv);
  $('#metrics').innerHTML = R.metrics.map(m => `<div><span>${esc(m[0])}</span><strong>${esc(m[1])}</strong><small>${esc(m[2])}</small></div>`).join('');
  $('#toolchart').innerHTML = R.main;
  $('#toolcap').innerHTML = `<span>${esc(R.caption || '')}</span>${R.link ? `<button data-act="open" data-v="${R.link}">Open the full model ${I.arrow}</button>` : ''}`;
}
function toolControls() {
  const t = st.tool;
  return ctlGroup('Demos', 'Each loads a preset; the sliders stay live.', `<div class="option-list">${t.presets.map((p, i) => `<button data-act="labpreset" data-v="${i}">${esc(p.label)}</button>`).join('')}<button data-act="labpreset" data-v="-1">Defaults</button></div>`)
    + ctlGroup('Inputs', 'Stylised values (assumed) unless a demo says otherwise.', t.inputs.map(i => i.kind === 'opt'
      ? optCtl(i.label, i.k, st.tv[i.k], i.options, '', 'labopt')
      : sliderCtl(i.label, i.k, st.tv[i.k], i.min, i.max, i.step, i.f(st.tv[i.k]), '', 'labr')).join(''));
}
function renderTool() {
  const t = st.tool;
  return `<header class="workspace-header"><button class="back-button" data-act="open" data-v="lab">${I.back}<span>Planning Lab</span></button>${brand(true)}
   <div class="workspace-world-title"><span>${esc(t.family)}</span><strong>${esc(t.name)}</strong></div><div class="workspace-actions">${themeBtn()}</div></header>
   <main class="workspace"><section class="world-sign"><div class="world-sign-copy"><p class="overline">PLANNING LAB · ${esc(t.family.toUpperCase())}</p><h1>${esc(t.tag)}</h1></div></section>
   <section class="metrics-strip" id="metrics"></section>${mobileTabs()}
   <div class="workspace-grid">
    <aside class="decision-panel workspace-panel ${st.mobile === 'decide' ? 'mobile-active' : ''}"><div class="panel-heading">${I.sliders}<div><h2>Inputs</h2><p>Results update as you move them.</p></div></div>${toolControls()}</aside>
    <section class="center-stage ${st.mobile === 'map' ? 'mobile-active' : ''}"><div class="map-toolbar"><div><p class="overline">RESULT</p><h2>${esc(t.name)}</h2></div></div>
     <div class="chart-frame tall" id="toolchart"></div><div class="chart-foot" id="toolcap"></div></section>
    <aside class="briefing-panel workspace-panel ${st.mobile === 'brief' ? 'mobile-active' : ''}"><div class="panel-heading">${I.book}<div><h2>The method</h2><p>What it computes and where it comes from.</p></div></div>
     <p class="world-pitch">${esc(t.method)}</p><h3>Formula</h3><pre class="formula">${esc(t.formula)}</pre><h3>Tradition</h3><p class="evidence-note">${esc(t.source)}</p>
     <h3>What it cannot tell you</h3><p class="evidence-note">${esc(t.limits)}</p></aside>
    <section class="numbers-panel ${st.mobile === 'numbers' ? 'mobile-active' : ''}"><div class="numbers-toolbar"><div><p class="overline">OTHER TOOLS</p><h2>Keep planning</h2></div></div>
     <div class="option-list">${TOOLS().filter(x => x.id !== t.id).map(x => `<button data-act="tool" data-v="${x.id}">${esc(x.name)}</button>`).join('')}</div></section>
   </div></main>`;
}

// ------------------------------------------------------------------ modals
function modalHTML() {
  if (st.modal === 'method') return `<p class="overline">MODEL CONTRACT</p><h2 id="modal-title">Arithmetic first. Interpretation second.</h2>
   <p class="modal-lede">Three engines run here, all in your browser. A fourth, the household schooling engine, runs in Python (engine/) and feeds the fitted numbers shown in the labour-market world.</p>
   <div class="method-grid"><article><span>01</span><h3>Planning worlds</h3><p>Cohort flows, teacher and classroom stocks, training lags and an annual budget identity, in the IIEP tradition. Behaviour sits in declared struts.</p></article>
   <article><span>02</span><h3>The six-district city</h3><p>A synthetic cohort model from Education Worlds 0.6, with every constant now a strut and two accounting fixes (layoffs, consolidation hires).</p></article>
   <article><span>03</span><h3>The youth labour market</h3><p>Search and matching with free entry of vacancies, CES diminishing returns, rigid wages and an NBS observation equation. Its core is categorical: workers are degree × network cells, positions have entry rules, and Tilly’s exploitation, hoarding, emulation and adaptation are built in at the boundaries, with sizes set by assumption and untested. It is a line-by-line port of the Python model and is tested against it.</p></article>
   <article><span>04</span><h3>The Planning Lab</h3><p>Twelve planning tools in the IIEP, UIS and education-sector-analysis tradition — reconstructed cohort, population and sector projection, teacher supply, deployment, equity of spending, grant formulas, school mapping, LAYS, target feasibility, graduate absorption. Independent implementations, not official software; 30 tests.</p></article>
   <article><span>05</span><h3>Three tiers of claim</h3><p><b>Identities</b> hold by construction and are checked every step. <b>Theorems</b> hold under stated assumptions and are tested in limiting cases (62 tests across Python and JavaScript). <b>Behaviour</b> is calibrated or assumed and labelled S (sourced), M (memory) or A (assumed).</p></article></div>
   ${st.S && st.S.W && st.S.W.sources ? `<div class="source-list"><h3>Sources & assumptions for ${esc(st.S.W.name)}</h3>${st.S.W.sources.map(s => `<p><b>${s[0]}</b>${s[2] ? `<a href="${esc(s[2])}" target="_blank" rel="noreferrer">${esc(s[1])}</a>` : `<span>${esc(s[1])}</span>`}</p>`).join('')}</div>` : ''}
   ${st.id === 'youth' ? `<div class="source-list"><h3>Sources for the labour market</h3>${Object.entries(D.inputs.sources).map(([k, v]) => `<p><b>${esc(k)}</b><span>${esc(v)}</span></p>`).join('')}</div>` : ''}
   <p class="storage-note">No account or server. Only your theme preference is stored in this browser.</p>`;
  if (st.id === 'youth') {
    const P = st.yopt, keys = Object.keys(D.params.tilly);
    return `<p class="overline">PARAMETERS</p><h2 id="modal-title">What the fit chose, and what was assumed.</h2><p class="modal-lede">Fitted values come from the Python whole-record fit. Tilly’s hoarding share, wage wedge and insider split were set, not estimated; the waiting and emulation mechanisms are untested; several fitted values sit on their bounds.</p>
     <div class="param-table"><table><thead><tr><th>Parameter</th><th>This run</th><th>Fitted preset</th></tr></thead><tbody>${keys.map(k => `<tr><td>${k}</td><td>${typeof P[k] === 'number' ? (+P[k]).toPrecision(3) : esc(P[k])}</td><td>${typeof D.params.tilly[k] === 'number' ? (+D.params.tilly[k]).toPrecision(3) : esc(D.params.tilly[k])}</td></tr>`).join('')}</tbody></table></div>
     <div class="modal-actions"><button class="primary-action" data-act="closemodal">Close</button></div>`;
  }
  const struts = isCity() ? AC.CITY_STRUTS : AW.STRUTS;
  return `<p class="overline">BEHAVIOURAL STRUTS</p><h2 id="modal-title">Assumptions you can inspect.</h2><p class="modal-lede">Counting pupils and rooms is arithmetic. These responses are assumptions. Change them, then replay from the start.</p>
   <div class="strut-list">${Object.entries(struts).map(([k, s]) => `<label><span><strong>${k.replace(/_/g, ' ')}</strong><output id="so-${k}">${(+st.S.struts[k]).toFixed(3)}</output></span><input type="range" min="${s.lo}" max="${s.hi}" step="${(s.hi - s.lo) / 100}" value="${st.S.struts[k]}" data-act="strut" data-k="${k}"><small>${esc(s.why)}</small></label>`).join('')}</div>
   <div class="modal-actions"><button data-act="strutreset">Reset assumptions & replay</button><button class="primary-action" data-act="replay">Replay with these</button></div>`;
}

// ------------------------------------------------------------------ render and events
function render() {
  setTheme(st.theme);
  const app = $('#app');
  if (st.page === 'library') app.innerHTML = renderLibrary();
  else if (st.page === 'lab') app.innerHTML = renderLabIndex();
  else if (st.page === 'tool') { app.innerHTML = renderTool(); toolDynamic(); }
  else if (st.id === 'youth') { app.innerHTML = renderYouth(); youthDynamic(); }
  else if (st.id === 'camchild') { app.innerHTML = renderCamChild(); CamChildUI.mount($('#cc-root')); }
  else { app.innerHTML = renderPlanning(); planningDynamic(); }
  app.insertAdjacentHTML('beforeend', st.modal ? `<div class="modal-backdrop" data-act="backdrop"><section class="model-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="modal-close icon-button" data-act="closemodal" aria-label="Close">${I.x}</button>${modalHTML()}</section></div>` : '');
}
let timer = null;
function setPlaying(on) {
  st.playing = on; clearInterval(timer);
  if (on) timer = setInterval(() => { if (!stepOnce()) { setPlaying(false); } planningDynamic(); }, 750);
  if ($('#play')) planningDynamic();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v, k = el.dataset.k;
  if (a === 'theme') { setTheme(st.theme === 'light' ? 'dark' : 'light'); render(); }
  else if (a === 'top') window.scrollTo({top: 0, behavior: 'smooth'});
  else if (a === 'worlds') $('#worlds').scrollIntoView({behavior: 'smooth'});
  else if (a === 'filter') { st.filter = v; render(); }
  else if (a === 'clearq') { st.query = ''; st.filter = 'All worlds'; render(); }
  else if (a === 'open' && v === 'lab') { setPlaying(false); st.page = 'lab'; st.id = null; render(); window.scrollTo(0, 0); }
  else if (a === 'tool') { st.page = 'tool'; st.mobile = 'map'; openTool(v); render(); window.scrollTo(0, 0); }
  else if (a === 'labpreset') { const t = st.tool; t.inputs.forEach(i => { st.tv[i.k] = i.v; }); if (+v >= 0) Object.assign(st.tv, t.presets[+v].v); render(); }
  else if (a === 'labopt') { st.tv[k] = JSON.parse(v); el.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === el)); toolDynamic(); }
  else if (a === 'open') { st.id = v; st.page = 'workspace'; st.mobile = 'map'; st.district = 0; st.level = 0; if (v === 'youth') openYouth(); else if (v !== 'camchild') openPlanning(v); render(); window.scrollTo(0, 0); }
  else if (a === 'library') { setPlaying(false); st.page = 'library'; st.id = null; st.S = null; render(); }
  else if (a === 'modal') { st.modal = v; render(); }
  else if (a === 'closemodal' || (a === 'backdrop' && e.target === el)) { st.modal = null; render(); }
  else if (a === 'mobile') { st.mobile = v; render(); }
  else if (a === 'district') { st.district = +v; planningDynamic(); }
  else if (a === 'level') { st.level = +v; planningDynamic(); }
  else if (a === 'layer') { st.layer = v; planningDynamic(); }
  else if (a === 'chart') { st.chart = v; planningDynamic(); }
  else if (a === 'restart') { setPlaying(false); resetPlanning(); planningDynamic(); }
  else if (a === 'step') { setPlaying(false); stepOnce(); planningDynamic(); }
  else if (a === 'play') { if (st.S.year >= st.S.W.end) { resetPlanning(); } setPlaying(!st.playing); }
  else if (a === 'pol' || a === 'polreset') { const val = JSON.parse(v); st.S.P[k] = val; if (a === 'polreset') resetPlanning(); el.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === el)); planningDynamic(); }
  else if (a === 'strutreset') { const S = isCity() ? AC.CITY_STRUTS : AW.STRUTS; for (const s in S) st.S.struts[s] = S[s].value; resetPlanning(); st.modal = null; render(); }
  else if (a === 'replay') { resetPlanning(); st.modal = null; render(); }
  else if (a === 'ychart') { st.ychart = v; youthDynamic(); }
  else if (a === 'ypreset') { openYouth(JSON.parse(v)); render(); }
  else if (a === 'yreset') { openYouth(st.preset); render(); }
  else if (a === 'ysup') { const val = JSON.parse(v); st.yopt.gradSupply = val === 'mult' ? 1.25 : val; runYouth(); render(); }
  else if (a === 'yopt') { let val = JSON.parse(v); if (k === 'sigma_A' && val === 'inf') val = Infinity; st.yopt[k] = val; runYouth(); el.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === el)); youthDynamic(); }
});
document.addEventListener('input', e => {
  const el = e.target; const a = el.dataset && el.dataset.act; if (!a) return;
  const k = el.dataset.k, v = +el.value;
  if (el.id === 'q') { st.query = el.value; const pos = el.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); return; }
  if (a === 'labr') { st.tv[k] = v; const inp = st.tool.inputs.find(i => i.k === k); const out = $('#out-' + k); if (out) out.textContent = inp.f(v); toolDynamic(); return; }
  if (a === 'polr') {
    const P = st.S.P;
    if (k.startsWith('ptr_')) { P.ptr_target = P.ptr_target.slice(); P.ptr_target[+k.slice(4)] = v; } else P[k] = v;
    const out = $('#out-' + k); if (out) out.textContent = k === 'pay' ? Math.round(v * 100) + '% of current' : k === 'capital_share' ? pct(v) : k === 'edu_share' ? (100 * v).toFixed(1) + '% of GDP' : k === 'classNorm' ? v + ' pupils' : Math.round(v);
    planningDynamic();
  } else if (a === 'seek') { setPlaying(false); seek(v); planningDynamic(); }
  else if (a === 'strut') { st.S.struts[k] = v; $('#so-' + k).textContent = v.toFixed(3); }
  else if (a === 'yr') {
    if (k === 'gradmult') st.yopt.gradSupply = v; else st.yopt[k] = v;
    const out = $('#out-' + k); if (out) out.textContent = k === 'gradmult' ? '×' + v.toFixed(2) : k === 'em_rate' ? v.toFixed(2) : pct(v);
    runYouth(); youthDynamic();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (st.modal) { st.modal = null; render(); } setPlaying(false); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('g[data-act]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', {bubbles: true})); }
});
function openLinkedModel() {
  const link = new URLSearchParams(location.hash.slice(1));
  const world = link.get('world'), tool = link.get('tool');
  if (tool && TOOLS().some(t => t.id === tool)) {
    st.page = 'tool'; st.mobile = 'map'; openTool(tool); return;
  }
  if (link.get('lab') !== null) { st.page = 'lab'; st.id = null; return; }
  if (world && SCEN.some(s => s.id === world)) {
    st.id = world; st.page = 'workspace'; st.mobile = 'map';
    if (world === 'youth') openYouth(); else if (world !== 'camchild') openPlanning(world);
  }
}
window.addEventListener('hashchange', () => {
  setPlaying(false); st.page = 'library'; st.id = null; st.S = null; st.modal = null;
  openLinkedModel(); render(); window.scrollTo(0, 0);
});
openLinkedModel();
render();
})();

</script>
